name: Set up PHP + app
description: >-
  PHP 8.5 + Node + Composer install + .env prep, shared by the Laravel test jobs
  so the runtime setup has a single source of truth (no drift between the SQLite
  and MariaDB jobs). Node is here because PHPUnit runs
  bin/gen-client-capabilities.mjs (DL-425), at the version the channel-server
  workflow uses. The caller must run actions/checkout BEFORE this — a local
  composite action only exists in the workspace once the repo is checked out.
runs:
  using: composite
  steps:
    - name: Set up Node 20
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '20'

    - name: Set up PHP 8.5
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
      with:
        php-version: '8.5'
        extensions: pdo, pdo_sqlite, pdo_mysql, mbstring, bcmath, intl, dom, fileinfo
        coverage: none
        tools: composer

    - name: Install Composer dependencies
      shell: bash
      run: composer install --no-interaction --no-progress --prefer-dist

    - name: Prepare environment
      shell: bash
      run: |
        cp .env.example .env
        php artisan key:generate
