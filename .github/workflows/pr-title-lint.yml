name: PR title correlation-key lint

# A PR whose head branch follows the <type>/<card-id>-slug convention MUST carry
# a card token or a `DL-<number>` token in its title. That token is the ONLY key the
# card-movement writeback has to correlate a merged PR back to its tracking card;
# without it the card silently never moves.
#
# WHICH spellings correlate is deliberately NOT restated here (card#5267, card#5308):
# `app/Bridge/Support/CardTokenGrammar.php` and `app/Bridge/Support/DlTokenGrammar.php`
# are the authorities, and
# `tests/Feature/Workflows/PrTitleLintTest.php` compares the regexes below against
# them answer-set to answer-set. A set spelled out in this header instead would be a
# copy nothing holds — which is how the runtime near-miss warning spent two
# releases naming a narrower set than the code enforced, and how the DL token below
# spent three grammar edits described to operators as `DL-NNNN` (four digits) against
# an unbounded `\d+`. The digit-count spelling is gone for the same reason. Where the
# require step below genuinely DISAGREES with an authority it is PINNED rather than
# repaired by default — repairing one changes what a CI gate accepts, which is a hard
# gate (card#5300); one row has been approved and fixed (DL-272), the rest are still
# pinned and the card is still open for them. The disagreements are
# enumerated in PrTitleLintTest, never here: a count in this header is the same kind
# of copy nothing holds, and it was already wrong once (the audit that wrote this
# paragraph found a further divergence the same day).
# The convention was empirically
# skipped (wave-1 2026-07-08: 8 PRs, zero automated card moves), so this converts
# the silent "card never moves" into a loud red check with an actionable message
# — the same silent->loud conversion as the release drift-gate.
#
# SCOPE / LIMITS (cannot be solved here — do not try):
#   - Token-presence lint only: it cannot verify the id resolves to a real card,
#     or to the RIGHT card.
#   - A cross-board work item (a board-12 card implemented via a kanban/bridge PR,
#     e.g. #3765 itself) passes this lint but still will not auto-move —
#     correlation is deliberately board-scoped 1:1 per repo (DL-174). This checks
#     the convention, not end-to-end card movement.
#   - NOT a required status check: it always runs, but the enforcement teeth are
#     the all-workflows-green dev-PR merge rule (CLAUDE.md rule 5), consistent
#     with the drift-gate.
#
# SECURITY: PR title and branch name are PR-author-controlled. They reach the
# script ONLY via the env: block and are used quoted ("$TITLE"/"$BRANCH") — never
# interpolated as ${{ }} inside the run: body (Actions script-injection class).
# See CLAUDE_DECISIONS.md DL-182.

on:
  pull_request:
    # "edited" is load-bearing: a title fix must re-run the check. "synchronize"
    # cannot change the title or branch name, so it is intentionally omitted.
    types: [opened, edited, reopened]

permissions:
  contents: read

jobs:
  lint-title:
    # No checkout — the job reads only the event payload.
    runs-on: ubuntu-latest
    steps:
      - name: Warn on a card or DL token that names nothing (DL-234)
        # UNCONDITIONAL — deliberately outside the <type>/<card-id>-slug branch gate
        # that the step below uses. That gate is precisely why this residue exists:
        # it skips `card-<id>-...`, `fix/...` and every other shape, so a token that
        # correlates to NOTHING sails through with no signal anywhere. The bridge's
        # FR-7 near-miss probe does warn, but into the bridge log, post-merge, on a
        # surface the PR author never reads.
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # WARNING, never a failure. The shapes caught here (`card_3`, `card.3`,
          # `card #82`) are legal-but-lossy TODAY — they already merge and already
          # fail to correlate — so turning them into a hard block is a separate
          # decision from closing the silent case. Unicode-digit tokens are the
          # genuinely-silent half this exists for (DL-231 made them correlate to
          # nothing; nothing warned, because the near-miss probe's own \d is ASCII
          # too, so `card_٣` is invisible even though `_` IS in its separator set).
          #
          # The predicate asserts the ACCEPTED GRAMMAR DID NOT MATCH rather than
          # enumerating what a bad token looks like. That inversion is why it needs
          # no Unicode awareness at all, and why it stays correct as the grammar
          # changes — it re-derives "bad" from "not good" instead of hard-coding a
          # list someone must remember to extend.
          subject=$(printf '%s\n%s' "$TITLE" "$BRANCH" | tr '[:upper:]' '[:lower:]')

          # looks-like-a-card-token: `card` — or the plural `cards`, which names
          # no card in any spelling — at a token boundary, followed by a
          # separator, a digit (the glued form, DL-233), or a space-then-hash.
          # A bare space is deliberately NOT a separator — DL-201 ruled that prose
          # ("supports card 2") stays silent, and that ruling still holds.
          looks='(^|[^0-9a-z_])cards?([-#_.:]|[0-9]| #)'
          # the ratified grammar, post-DL-233: separated takes 1+ digits, glued 2+.
          # NOT kept in lockstep by discipline — PrTitleLintTest extracts this line
          # and compares its ANSWER SET against CardTokenGrammar's over shared
          # vectors, so editing either side without the other reds the suite.
          good='(^|[^0-9a-z_])card([-#][0-9]|[0-9]{2})'

          if grep -qE "$looks" <<<"$subject" && ! grep -qE "$good" <<<"$subject"; then
            echo "::warning::This PR's title or branch looks like it names a card, but the token does not match the correlation grammar, so NO card will move. Accepted: card-<id>, card#<id>, or glued card<id> (2+ digits). Common misses: card_123 / card.123 / card:123 / card #123 (underscore, dot, colon, space are not separators), the plural in any spelling (cards #123, cards#123, cards-123, ... — the token is singular), a single-digit glued card4, and non-ASCII digits (the grammar is ASCII 0-9 only, DL-231)."
          fi

          # THE DL ARM (card#5961). The same predicate on the other correlation
          # token, in the same step, at the same severity: DL-234(c) settles the
          # severity, and DL-250(e) recorded that "it changes what a CI check
          # reports" does not by itself make a warn-leg edit a hard gate — it
          # retracted that ground precisely because the card arm's own widening
          # satisfied it too. It exists because the DL stem was WORSE off than the
          # card stem, not merely uncovered: the runtime near-miss probe's digit
          # class is ASCII by ratification (DL-231), so a Unicode-digit DL warns
          # nowhere in the bridge log, and the card stem is only acceptable there
          # because the arm above names that class BY NAME to the author. With no
          # DL arm, `DL-<U+0663>239` was silent on BOTH surfaces.
          #
          # `good_dl` has no glued alternative where `good` has `[0-9]{2}`: the DL
          # token's separator is mandatory and it has no glued arm. Not kept in
          # lockstep by discipline — PrTitleLintTest extracts both lines below and
          # compares their ANSWER SETS against DlTokenGrammar and the runtime
          # near-miss probe, so editing either side alone reds the suite.
          #
          # DISCLOSED, not buried — this arm fires on TWO shapes real subjects in
          # this repo actually carry, and only one of them is noise:
          #   - `dl` at a token boundary then a separator and NO digit
          #     (`fix/dl-parser`, "a dl-token near-miss"). NOISE, inherited from the
          #     card arm's legitimate looseness (DL-250(e)): `looks_dl` needs no
          #     digit after the separator, so it cannot tell this from a real miss.
          #   - the GLUED `dlNNN` (`feature/dl189-…`, `docs/dl204-…`). NOT noise —
          #     the DL token's separator is mandatory, so a glued spelling names no
          #     DL and moves no card. DL-273 measured this shape across this repo's
          #     own history and it is exactly what the arm exists to catch.
          # No count here: this header already rules that a number in a comment is a
          # copy nothing holds, and a population that grows with the repo would make
          # one stale on the next merge. Never a merge block either way — the leg
          # emits `::warning::` and exits 0, both pinned in PrTitleLintTest.
          looks_dl='(^|[^0-9a-z_])dls?([-#_.:]|[0-9]| #)'
          good_dl='(^|[^0-9a-z_])dl-[0-9]'

          if grep -qE "$looks_dl" <<<"$subject" && ! grep -qE "$good_dl" <<<"$subject"; then
            echo "::warning::This PR's title or branch looks like it names a DL, but the token does not match the correlation grammar, so NO card will move. Accepted: DL-<number> — the hyphen is required and there is no glued form. Common misses: DL_239 / DL.239 / DL:239 / DL#239 / DL #239 (underscore, dot, colon, hash, space are not separators), the glued DL239, the plural in any spelling (DLs-239, DLs239, ... — the token is singular), and non-ASCII digits (the grammar is ASCII 0-9 only, DL-231)."
          fi

      - name: Require card#/DL token for card-id branches
        # Explicit bash: the script uses pipefail + [[ =~ ]], and a self-hosted
        # runner without bash on PATH would otherwise silently fall back to sh.
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # Non-feature branches carry no card id — skip (pass).
          case "$BRANCH" in
            dependabot/*|release/*|sync/*|revert-*)
              echo "Branch '$BRANCH' is exempt (automation/release/revert) — skipping."
              exit 0
              ;;
          esac

          # Case-insensitive throughout: the classifier's regexes are /i, so the
          # lint folds its INPUTS once and matches lowercase patterns — a title
          # the classifier correlates must never red here on case alone (#4384).
          branch_lc=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]')
          title_lc=$(printf '%s' "$TITLE" | tr '[:upper:]' '[:lower:]')

          # The <type>/<card-id>-slug convention: a type segment, a numeric card
          # id, then a hyphen. Anything else has no card id to enforce.
          if [[ ! "$branch_lc" =~ ^[a-z-]+/[0-9]+- ]]; then
            echo "Branch '$BRANCH' does not follow <type>/<card-id>-slug — no card id to enforce, skipping."
            exit 0
          fi

          # Extract the card id: drop the leading "type/", then keep the digits
          # up to the first hyphen.
          card_id="${branch_lc#*/}"
          card_id="${card_id%%-*}"

          # Accept a genuine "card-<exact-id>"/"card#<exact-id>"/glued
          # "card<exact-id>" (the separator is optional since DL-233 — the lint must
          # accept everything the classifier correlates, or it reds a title that
          # would have moved the card — an INTENT, not an invariant: this step has
          # measured exceptions in both directions, pinned in PrTitleLintTest and
          # tracked as card#5300, because repairing either changes what this gate
          # accepts) or "DL-<1-4
          # digits>" token, bounded on BOTH sides so a coincidental substring does
          # not satisfy the check: the leading (^|[^0-9a-z_]) mirrors the
          # classifier's \b (underscore is a word char there — a title the lint
          # passes must also correlate), rejecting tails like "IDL-2"/
          # "discard#3770"/"foo_card-3770"; the trailing ([^0-9]|$) rejects a
          # longer id like "card#37700". Inputs are pre-folded, so the lowercase
          # class is the whole alphabet.
          #
          # The DL arm enumerates its digits instead of writing the range [0-9]
          # because a bracket RANGE inside bash's [[ =~ ]] is resolved by
          # COLLATION, not by codepoint: under en_US.UTF-8 (measured; C and
          # C.UTF-8 disagree) [0-9] admits U+0663 and friends, so the gate
          # greened "DL-<ARABIC-INDIC THREE>" — a token the classifier's ASCII
          # \d correlates to nothing, which is the silent no-op this gate exists
          # to stop, and a breach of DL-231's fleet-wide ASCII-digits-only
          # clause. An enumerated set depends on no locale data at all, where
          # [[:digit:]] would trade one piece of locale data for another. The
          # ranges that REMAIN below are negated ([^0-9], [^0-9a-z_]) and the
          # branch-shape test, where collation reds instead of greening;
          # narrowing those would make this gate more permissive, so they are
          # measured and pinned in PrTitleLintTest under card#5300, not fixed
          # here.
          if [[ "$title_lc" =~ (^|[^0-9a-z_])card[-#]?${card_id}([^0-9]|$) ]] || [[ "$title_lc" =~ (^|[^0-9a-z_])dl-[0123456789]{1,4}([^0-9]|$) ]]; then
            echo "OK: title carries a correlation token for card $card_id."
            exit 0
          fi

          echo "::error::PR title is missing a card-movement correlation token."
          echo "Branch '$BRANCH' targets card $card_id, but the title carries neither 'card-$card_id' (nor 'card#$card_id') nor a 'DL-<number>' token."
          echo "The writeback uses this token as its ONLY key to move the tracking card; without it the card silently never moves."
          echo "Fix: add 'card-$card_id' or the relevant 'DL-<number>' to the PR title, then re-save (the 'edited' event re-runs this check)."
          exit 1
