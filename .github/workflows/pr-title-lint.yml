name: PR title correlation-key lint

# TWO REQUIREMENTS, one per half of the writeback contract, and they are different
# propositions — which is the whole reason the second one exists:
#
#   CORRELATION — a PR whose head branch NAMES a card id MUST carry that card's own
#   token in its title, AND that must be the token the writeback SELECTS. Without the
#   token the card silently never moves; with the token in the wrong POSITION a
#   DIFFERENT card moves and this one still does not (card#10031).
#
#   ⛔ A `DL-<number>` NO LONGER SATISFIES THE CORRELATION REQUIREMENT. It was a second
#   accept arm and it was bound to nothing: it matched the DL SHAPE, while the
#   writeback resolves a DL's VALUE against `payload.dl_number` on the board, where a
#   DL belongs to whatever card owns it and not to this branch. It survives as a
#   DIAGNOSTIC on the failure path.
#
#   CLOSURE (card#8294) — a PR that CORRELATES a card must also CLAIM that merging
#   it finishes that card, on one of the two routes DL-305/DL-308 accept. Correlation
#   never implied closure and nothing checked for it, so the house convention drifted
#   into satisfying the first requirement and neither route of the second: 8
#   consecutive merges moved nothing. `CLAUDE_CONVENTIONS.md` § *PR titles* states the
#   convention; the closure step at the bottom of this file enforces it; and
#   `docs/writeback.md` § *Mention vs closure* owns the runtime rule both defer to.
#
# WHICH branch spellings name a card id is owned by the require step's own
# predicate and is deliberately NOT restated here — for the same reason the token
# grammar is not (below), and now with the same measured history: the set this
# header used to name (`<type>/<card-id>-slug`) was the accept-set the house
# convention then drifted away from, and the gate ran green over the difference
# for months (card#6822).
#
# WHICH spellings correlate is deliberately NOT restated here (card#5267, card#5308):
# `app/Bridge/Support/CardTokenGrammar.php` and `app/Bridge/Support/DlTokenGrammar.php`
# are the authorities, and
# `tests/Feature/Workflows/PrTitleLintTest.php` compares the regexes below against
# them answer-set to answer-set. A set spelled out in this header instead would be a
# copy nothing holds — which is how the runtime near-miss warning spent two
# releases naming a narrower set than the code enforced, and how the DL token below
# spent three grammar edits described to operators as `DL-NNNN` (four digits) against
# an unbounded `\d+`. The digit-count spelling is gone for the same reason. Where the
# require step below genuinely DISAGREES with an authority it is PINNED rather than
# repaired by default — repairing one changes what a CI gate accepts, which is a hard
# gate (card#5300); one row was approved and fixed (DL-272) and the rest have closed
# as side effects rather than repairs (card#10031), the card staying open for what
# is still pinned. The disagreements are
# enumerated in PrTitleLintTest, never here: a count in this header is the same kind
# of copy nothing holds, and it was already wrong once (the audit that wrote this
# paragraph found a further divergence the same day).
# The convention was empirically
# skipped (wave-1 2026-07-08: 8 PRs, zero automated card moves), so this converts
# the silent "card never moves" into a loud red check with an actionable message
# — the same silent->loud conversion as the release drift-gate.
#
# SCOPE / LIMITS (cannot be solved here — do not try):
#   - It reads the event payload and nothing else, so it cannot verify the id
#     resolves to a REAL, open card on the board. What it DOES pin, since
#     card#10031, is both halves of the correlation question: the branch's token is
#     PRESENT in the title, and it is the token the writeback would SELECT.
#   - ⛔ THE SELECTION RULE IS THE WRITEBACK'S AND THIS FILE IS A SECOND ENGINE FOR
#     IT. `GitHubPrCardMoveClassifier::cardTokenResolution()` over
#     `CardTokenGrammar::parse()` is the authority: the head ref's token when the ref
#     carries one, else the title's LEFTMOST token. It is re-implemented here in bash
#     because the job has no checkout — and it is TIED, not trusted:
#     `PrTitleLintTest` drives this step's selection against what the REAL classifier
#     emits as its move target, so the order and the grammar cannot drift.
#   - ⚠ THE SIBLING COPY IN `kanban-board` CANNOT BE TIED THAT WAY and this is the
#     one place both ends are named together. That repo's CI has no bridge checkout
#     and no `CardTokenGrammar` to compare against, so its copy of this rule is
#     pinned to a TABLE of this grammar's answers and a change HERE reds nothing
#     THERE. The seam is declared, in kanban card#10062, and in that repo's own step
#     — it is not closed. Closing it means one shared implementation both repos
#     consume; until then, a change to `CardTokenGrammar` or to the resolution order
#     is a TWO-REPO change.
#   - A cross-board work item (a board-12 card implemented via a kanban/bridge PR,
#     e.g. #3765 itself) passes this lint but still will not auto-move —
#     correlation is deliberately board-scoped 1:1 per repo (DL-174). This checks
#     the convention, not end-to-end card movement.
#   - NOT a required status check — and NOT one that "always runs", which is what
#     this line claimed until card#7597 disproved it. Branch protection on `dev`
#     requires the test and secret-scan contexts, not this one, so the enforcement
#     teeth are the all-workflows-green dev-PR merge rule (CLAUDE.md rule 5),
#     consistent with the drift-gate. That rule reads the runs that EXIST, and a
#     check that never ran produces no row, no annotation and no conclusion, so
#     nothing distinguishes it from a check that passed — DL-283 owns that property
#     and this gate is a second instance of it. The `synchronize` trigger below
#     closes the one recovery hole this gate had; it does NOT close that class, and
#     it is worse for the PATH-FILTERED workflows in this repo, where zero runs is
#     the normal correct state and "never ran", "correctly skipped" and "passed"
#     are one reading.
#
# SECURITY: PR title and branch name are PR-author-controlled. They reach the
# script ONLY via the env: block and are used quoted ("$TITLE"/"$BRANCH") — never
# interpolated as ${{ }} inside the run: body (Actions script-injection class).
# See CLAUDE_DECISIONS.md DL-182.

on:
  pull_request:
    # "edited" is load-bearing: the title is an INPUT, and a title fix fires only
    # this event.
    #
    # "synchronize" is here for RECOVERY, not for its inputs, and that distinction is
    # the whole reason it reads as removable. A push provably cannot change the title
    # or the head branch name — the only two things this gate reads — so every
    # synchronize run re-answers a question whose inputs did not move, and on exactly
    # that reasoning it was originally omitted. The reasoning is correct about what a
    # push CHANGES and wrong about what a push RESTORES: GitHub creates NO workflow
    # runs at all for a PR whose merge ref it cannot compute (the base moved and the
    # PR is conflicting), and the conflict is then cleared by a push — i.e. by a
    # synchronize. Without it, a PR opened while conflicting never gets a FIRST run of
    # this gate and no later ordinary event gives it one; every recovery left is a
    # HUMAN act (edit the title or body to fire "edited"; close and reopen to fire
    # "reopened"), and nothing prompts anyone to perform one. Measured on kanban-board
    # PR #651: zero runs on the first head, not a slow queue — this file carried that
    # repo's trigger list and its justifying comment word for word, which is why it
    # carried the same hole (card#7597, ported from kanban-board PR #653). Measured HERE
    # too, on the old list: PR #574's push-created head 8623d5fa produced SIX
    # pull_request runs and no title-lint row at all — six of the seven OTHER
    # pull_request gates ran, and the seventh (channel-server-supply-chain) is
    # path-filtered and correctly did not match that diff. The absence of this one is
    # this trigger, not a queue and not a path. The redundant runs are the
    # accepted price of the recovery path — do not optimise this back out.
    #
    # Asserted in tests/Feature/Workflows/PrTitleLintTest.php so removing an entry
    # reds rather than silently reopening the hole.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  lint-title:
    # No checkout — the job reads only the event payload.
    runs-on: ubuntu-latest
    env:
      # THE COLLATION IS PINNED FOR THE WHOLE JOB, not inherited from the runner
      # (card#10031). bash resolves a bracket RANGE by collation, and every step below
      # decides which card a PR is about with one: under en_US.UTF-8 a non-ASCII letter
      # stops being a boundary in `(^|[^0-9a-z_])`, so the leftmost card token is
      # skipped and the wrong card is selected. Measured, both directions, on the two
      # steps with teeth — `docs: port écard-1234 guidance (card#9996)` on a
      # `fix/9996-slug` branch GREENS the require step's hijack check, and
      # `… (closes card#9996)` makes the closure step answer "OK: the title carries a
      # closing form naming card 9996" about a title that correlates card 1234.
      # HERE rather than on each step: three step-level pins are the same fix written
      # three times, and the fourth step someone adds would need a fourth. Narrowing
      # the ranges instead would make the gate more permissive (card#5300), and DL-272
      # already records this job giving a host-dependent answer. PrTitleLintTest drives
      # EVERY step of this job through the env Actions composes, and mutates the pin
      # away to show both false greens come back.
      LC_ALL: C.UTF-8
    steps:
      - name: Warn on a card or DL token that names nothing (DL-234)
        # UNCONDITIONAL — deliberately outside the card-id branch gate the step
        # below uses. That gate is precisely why this residue exists: it skips every
        # branch it can read no card id out of (`chore/docs`,
        # `fix/decouple-check-name-from-runtime`), so a token that correlates to
        # NOTHING sails through with no signal anywhere. card#6822 NARROWED that
        # skipped set — `card-<id>-...` and `fix/card<id>-...` are enforced now — it
        # did not empty it, so the residue is smaller and still real. The bridge's
        # FR-7 near-miss probe does warn, but into the bridge log, post-merge, on a
        # surface the PR author never reads.
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # WARNING, never a failure. The shapes caught here (`card_3`, `card.3`,
          # `card #82`) are legal-but-lossy TODAY — they already merge and already
          # fail to correlate — so turning them into a hard block is a separate
          # decision from closing the silent case. Unicode-digit tokens are the
          # genuinely-silent half this exists for (DL-231 made them correlate to
          # nothing; nothing warned, because the near-miss probe's own \d is ASCII
          # too, so `card_٣` is invisible even though `_` IS in its separator set).
          #
          # The predicate asserts the ACCEPTED GRAMMAR DID NOT MATCH rather than
          # enumerating what a bad token looks like. That inversion is why it needs
          # no Unicode awareness at all, and why it stays correct as the grammar
          # changes — it re-derives "bad" from "not good" instead of hard-coding a
          # list someone must remember to extend.
          subject=$(printf '%s\n%s' "$TITLE" "$BRANCH" | tr '[:upper:]' '[:lower:]')

          # looks-like-a-card-token: `card` — or the plural `cards`, which names
          # no card in any spelling — at a token boundary, followed by a
          # separator, a digit (the glued form, DL-233), or a space-then-hash.
          # A bare space is deliberately NOT a separator — DL-201 ruled that prose
          # ("supports card 2") stays silent, and that ruling still holds.
          looks='(^|[^0-9a-z_])cards?([-#_.:]|[0-9]| #)'
          # the ratified grammar, post-DL-233: separated takes 1+ digits, glued 2+.
          # NOT kept in lockstep by discipline — PrTitleLintTest extracts this line
          # and compares its ANSWER SET against CardTokenGrammar's over shared
          # vectors, so editing either side without the other reds the suite.
          good='(^|[^0-9a-z_])card([-#][0-9]|[0-9]{2})'

          if grep -qE "$looks" <<<"$subject" && ! grep -qE "$good" <<<"$subject"; then
            echo "::warning::This PR's title or branch looks like it names a card, but the token does not match the correlation grammar, so it correlates to nothing: no card will move on this token. Accepted: card-<id>, card#<id>, or glued card<id> (2+ digits). Common misses: card_123 / card.123 / card:123 / card #123 (underscore, dot, colon, space are not separators), the plural in any spelling (cards #123, cards#123, cards-123, ... — the token is singular), a single-digit glued card4, and non-ASCII digits (the grammar is ASCII 0-9 only, DL-231)."
          fi

          # THE DL ARM (card#5961): the same warn-only predicate on the DL stem,
          # in the same step at the same severity (severity: DL-234(c); on
          # gating, DL-250(e) retracted "it changes what a CI check reports" as
          # a discriminator and ruled nothing further). It exists to
          # name the non-ASCII-digit class to the author: the runtime probe's
          # digit class is ASCII by ratification (DL-231), so `DL-<U+0663>239`
          # warns nowhere at runtime on either stem — the card stem has had this
          # CI cover since DL-234; the DL stem had none (DL-273). Suppression is
          # whole-subject PER STEM (`subject=` above joins title+branch; each
          # arm greps only its own `good` pattern, so only a parsed token of the
          # SAME stem suppresses); the arm's measured reach on repo history
          # lives in the card#5961 CHANGELOG entry.
          #
          # `good_dl` has no glued alternative where `good` has `[0-9]{2}`: the DL
          # token's separator is mandatory and it has no glued arm. Not kept in
          # lockstep by discipline — PrTitleLintTest extracts both lines below and
          # compares their ANSWER SETS against DlTokenGrammar and the runtime
          # near-miss probe, so editing either side alone reds the suite.
          #
          # Both arms fire on a separator-with-no-digit shape (`fix/dl-parser`,
          # `card-layout-rework`) — a known false positive; the class is tracked
          # as card#6028. Never a merge block: the leg emits `::warning::` and
          # exits 0, both pinned in PrTitleLintTest.
          looks_dl='(^|[^0-9a-z_])dls?([-#_.:]|[0-9]| #)'
          good_dl='(^|[^0-9a-z_])dl-[0-9]'

          if grep -qE "$looks_dl" <<<"$subject" && ! grep -qE "$good_dl" <<<"$subject"; then
            echo "::warning::This PR's title or branch looks like it names a DL, but the token does not match the correlation grammar, so it correlates to nothing: no card will move on this token and no dl_number will be stamped from it. Accepted: DL-<number> — the hyphen is required and there is no glued form. Common misses: DL_239 / DL.239 / DL:239 / DL#239 / DL #239 (underscore, dot, colon, hash, space are not separators), the glued DL239, the plural in any spelling (DLs-239, DLs239, ... — the token is singular), and non-ASCII digits (the grammar is ASCII 0-9 only, DL-231)."
          fi

      - name: Require the card# token the writeback SELECTS for card-id branches
        # Explicit bash: the script uses pipefail + [[ =~ ]], and a self-hosted
        # runner without bash on PATH would otherwise silently fall back to sh.
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # Non-feature branches carry no card id — skip (pass).
          case "$BRANCH" in
            dependabot/*|release/*|sync/*|revert-*)
              echo "Branch '$BRANCH' is exempt (automation/release/revert) — skipping."
              exit 0
              ;;
          esac

          # Case-insensitive throughout: the classifier's regexes are /i, so the
          # lint folds its INPUTS once and matches lowercase patterns — a title
          # the classifier correlates must never red here on case alone (#4384).
          branch_lc=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]')
          title_lc=$(printf '%s' "$TITLE" | tr '[:upper:]' '[:lower:]')

          # A branch NAMES a card id when, after an optional `<type>/` segment and
          # an optional `card`/`card-` prefix, it opens with digits then a hyphen.
          # Both optionals are measured house shapes, not speculation (card#6822):
          # `card-5538-...` and `fix/card6371-...` are spellings this repo merges,
          # and the type-segment-only set this gate used to require skipped both. The
          # second READS as compliant, which is why the drift went unnoticed. The
          # measured population lives in the card#6822 CHANGELOG entry rather than
          # here — a count in a comment is the copy nothing holds, which this file
          # already says about the token grammar and had just been proven about the
          # branch shape.
          #
          # ONE regex both DECIDES and EXTRACTS. The id used to be re-derived by
          # `${branch_lc#*/}` then `${card_id%%-*}` — a second parse that agreed
          # with the predicate only on the single shape the predicate accepted.
          # Widening the predicate alone would have yielded `card6371` for the
          # prefixed shape and the whole branch name for the segment-less one, so
          # the gate would fire and then compare the title against an id that names
          # nothing: a red PR with an unactionable message, strictly worse than the
          # skip it replaced.
          #
          # `[0-9]` stays a RANGE here where the token arms below enumerate their
          # digits: enumerating it would SKIP a Unicode-digit branch instead of
          # enforcing against it, which makes the gate MORE permissive — a hard gate,
          # measured in PrTitleLintTest under card#5300, not fixed here. What the
          # runner's locale decides is no longer this: the JOB's `env:` pins the
          # collation (card#10031), so the range resolves to ASCII wherever it runs.
          #
          # DISCLOSED, not overlooked: with both optionals empty the accepted shape
          # is a bare leading `<digits>-`, so a date- or version-named branch
          # (`2026-08-18-notes`) is now enforced against id 2026. No such branch
          # exists in the measured corpus and neither does a bare `5538-slug`, so
          # both arms of the choice are hypothetical — it is taken toward the LOUD
          # failure, because a wrong skip is the silence this whole gate exists to
          # remove. Characterized in PrTitleLintTest.
          if [[ ! "$branch_lc" =~ ^([a-z-]+/)?(card-?)?([0-9]+)- ]]; then
            echo "Branch '$BRANCH' names no card id — nothing to enforce, skipping."
            echo "A card-id branch is: an optional '<type>/' segment, an optional 'card'/'card-' prefix, the id, then a hyphen (fix/6100-slug, card-5538-slug, fix/card6371-slug)."
            exit 0
          fi

          # Set by the `=~` above — the `!` negates the TEST, not the capture.
          card_id="${BASH_REMATCH[3]}"

          # CONJUNCT 1 — PRESENCE. A genuine "card-<exact-id>"/"card#<exact-id>"/glued
          # "card<exact-id>" (the separator is optional since DL-233 — the lint must
          # accept everything the classifier correlates, or it reds a title that
          # would have moved the card — an INTENT, not an invariant: this step has
          # measured exceptions in both directions, pinned in PrTitleLintTest and
          # tracked as card#5300, because repairing either changes what this gate
          # accepts), bounded on BOTH sides so a coincidental substring does
          # not satisfy the check: the leading (^|[^0-9a-z_]) mirrors the
          # classifier's \b (underscore is a word char there — a title the lint
          # passes must also correlate), rejecting tails like
          # "discard#3770"/"foo_card-3770"; the trailing ([^0-9]|$) rejects a
          # longer id like "card#37700". Inputs are pre-folded, so the lowercase
          # class is the whole alphabet.
          #
          # ⛔ THE DL ARM IS GONE FROM THE ACCEPT-CHECK (card#10031). It matched the DL
          # SHAPE while the writeback resolves a DL's VALUE against `payload.dl_number`
          # on the board, where a DL is bound to no one card — so a title carrying only a DL
          # (no co-present card#, so the writeback's DL-218 conflict guard never fires)
          # greened here while FR-7 try-in-order resolved the DL and moved WHICHEVER
          # card owns it. It survives below as a DIAGNOSTIC on the failure path, which
          # is the only thing it was ever able to tell an author truthfully.
          #
          # WHY NOT RESOLVE THE DL HERE instead — the narrower predicate is the fix,
          # not the cheap half of one. The authority for DL -> card is the BOARD, not a
          # CI job with no checkout; nothing guarantees a card carries its DL when this
          # gate runs (the stamping write-back is an open obligation); and a DL in a
          # title is often legitimately descriptive or bundled (DL-148), which the
          # writeback already rules on by preferring a disagreeing card# (DL-218).
          # Requiring the card# makes this gate REQUIRE what the writeback PREFERS.
          present=0
          if [[ "$title_lc" =~ (^|[^0-9a-z_])card[-#]?${card_id}([^0-9]|$) ]]; then
            present=1
          fi

          # CONJUNCT 2 — SELECTION, the half presence cannot express (card#10031 /
          # kanban card#10062). Presence asks "is this branch's token SOMEWHERE in the
          # title"; the writeback never asks that. It SELECTS exactly one card —
          # `GitHubPrCardMoveClassifier::cardTokenResolution()`: the HEAD REF's token
          # when the ref carries one (the ref is minted by this install's own tooling
          # and OUTRANKS the title), otherwise the TITLE's LEFTMOST token
          # (`CardTokenGrammar::parse()` is a single leftmost `preg_match`). So a title
          # citing another card BEFORE its own satisfied presence and selected the
          # other card: the gate greened, the merge moved card N, and this branch's
          # card never moved.
          #
          # ONE RULE, DERIVED AT BOTH ENDS — `token` below is the SAME expression the
          # closure step uses, and PrTitleLintTest holds every card-token regex in this
          # workflow to ONE answer set against `CardTokenGrammar`, and holds this
          # step's SELECTION to what the REAL classifier emits as its move target. The
          # order (head ref, then title) is tied the same way. Neither is kept in
          # lockstep by discipline.
          #
          # ⚠ The selection scan uses the FULL token grammar while the presence check
          # above demands this branch's id — deliberately, and they are not
          # interchangeable: the writeback selects over every spelling it parses, so a
          # leftmost `card-1234` hijacks a title whose own token is `card#9996`. A
          # selection scan narrowed to the presence spelling would not see it.
          #
          # ⚠ THE CONSOLIDATION IS NAMED AND DECLINED (canon #7), not overlooked: this
          # assignment and the closure step's are BYTE-IDENTICAL, and the obvious fix —
          # hoist one `token=` to the job's `env:` — is REFUSED because it would blind
          # the check that makes the duplication safe. `PrTitleLintTest` derives the
          # copies by scanning every step's `run:` script for `token=`/`good=` and
          # drives each against `CardTokenGrammar`; a copy in `env:` is not in any
          # `run:` script, so hoisting would delete the tie rather than the drift. Each
          # copy is driven against the grammar's answer set independently, so a
          # divergence between them REDS — which is the property the hoist was for.
          # Revisit only with a scan that reads both.
          token='(^|[^0-9a-z_])card([-#]([0123456789]+)|([0123456789][0123456789]+))'

          # Leading zeros fold, as the grammar's own (int) cast folds them. Stripped
          # rather than folded through `$((10#…))`: bash arithmetic WRAPS at 2^63 where
          # the grammar's (int) saturates, so a 20-digit token made this step name a
          # card neither engine ever selects (`card#99999999999999999999` printed
          # "selects card 7766279631452241919"). Stripping is exact at any length.
          fold_id() {
            local d="$1"
            while [ "${d:0:1}" = 0 ] && [ "${#d}" -gt 1 ]; do d="${d:1}"; done
            printf '%s' "$d"
          }

          if [[ "$branch_lc" =~ $token ]]; then
            # Exactly one arm captured.
            selected=$(fold_id "${BASH_REMATCH[3]}${BASH_REMATCH[4]}")
            selected_surface=head
            selected_from="the head ref, which outranks the title"
          elif [[ "$title_lc" =~ $token ]]; then
            selected=$(fold_id "${BASH_REMATCH[3]}${BASH_REMATCH[4]}")
            selected_surface=title
            selected_from="the title's LEFTMOST card token"
          else
            selected=""
            selected_surface=none
            selected_from=""
          fi

          # The branch id normalised the way the grammar normalises an id it parses, so
          # a leading-zero branch (`fix/0123-slug`) compares equal to card 123 instead
          # of minting a new false red.
          #
          # GUARDED, and the guard is load-bearing rather than defensive: the branch
          # predicate above keeps `[0-9]` as a RANGE on purpose (card#5300), so a
          # collation that admits a Unicode digit makes `card_id` one. It is left EMPTY
          # rather than carried into the compare, and the `-n` test below is the other
          # half of that: empty is "no id", never "an id that matched". The step's
          # job-level `env:` pin is what keeps a runner from reaching this state at
          # all; the two are independent, and this one holds if the pin is dropped.
          card_id_n=''
          if [[ "$card_id" =~ ^[0123456789]+$ ]]; then
            card_id_n=$(fold_id "$card_id")
          fi

          # PRINTED ON EVERY RUN, pass or fail — the selection is the whole subject of
          # this step and an author cannot act on a verdict that does not say which
          # card the merge will actually move. PrTitleLintTest reads this line.
          if [ -n "$selected" ]; then
            echo "The writeback selects card $selected from $selected_from."
          else
            echo "The writeback selects no card from either surface."
          fi

          # `-n "$card_id_n"` is the OTHER half of the Unicode guard above and is not
          # redundant: with a non-ASCII branch id BOTH sides of the compare are the
          # empty string (the selection scan's digits are enumerated, so it parses no
          # Unicode-digit token either), and `[ "" = "" ]` is TRUE — a title carrying
          # the same Unicode-digit token would GREEN on a card the writeback selects
          # nothing for. Empty is "no id", never "an id that matched".
          if [ "$present" = 1 ] && [ -n "$card_id_n" ] && [ "$selected" = "$card_id_n" ]; then
            echo "OK: title carries card#$card_id AND that is the card the writeback selects."
            exit 0
          fi

          # FOUR FAULTS, FOUR MESSAGES, because the ACTION differs at each: "add the
          # token" is useless to an author whose token is already there; "make it
          # first" is useless when the HEAD REF is what selects, since no retitling can
          # move it; and neither applies when the merge would already move the right
          # card. Collapsing any of them prints advice that does not apply, which is
          # what an author then loops on against a red gate.
          if [ "$present" != 1 ]; then
            if [ -n "$card_id_n" ] && [ "$selected" = "$card_id_n" ]; then
              echo "::error::PR title does not name card $card_id, which is the card this merge moves."
              # SOMETHING ALREADY SELECTS THIS CARD — a `card`-stem head ref, or a
              # title spelling the presence check does not accept (`card#0123`). The
              # "silently never moves" sentence and the DL one below are both FALSE
              # here, refuted by the selection line this step just printed. Only the
              # requirement itself is left to state.
              echo "Branch '$BRANCH' targets card $card_id, and that IS the card the writeback selects — the merge does move it."
              echo "This gate requires the title to carry 'card-$card_id' or 'card#$card_id' as well."
              echo "Fix: add 'card-$card_id' to the PR title, then re-save (the 'edited' event re-runs this check)."
            else
              echo "::error::PR title is missing a card-movement correlation token."
              echo "Branch '$BRANCH' targets card $card_id, but the title carries neither 'card-$card_id' nor 'card#$card_id'."
              echo "The writeback uses this token as its ONLY key to move the tracking card; without it the card silently never moves."
              # THE DL DIAGNOSTIC — no longer an accept arm (card#10031), and it is on
              # THIS arm because a title carrying only a DL is the single most likely
              # way to arrive at this exact failure. Digits are ENUMERATED rather than
              # written [0-9] because a bracket RANGE inside bash's [[ =~ ]] is
              # resolved by COLLATION, not by codepoint: under en_US.UTF-8 (measured; C
              # and C.UTF-8 disagree) [0-9] admits U+0663 and friends, so this message
              # appeared on one runner and not another. The shape is the authority's —
              # `+` digits and NO trailing boundary — which closes both of card#5300's
              # DL pins: the four-digit bound withheld the sentence from a 5-digit DL,
              # and the trailing `([^0-9]|$)` stopped bounding under a collation locale
              # and withheld it from `dl-1234<U+0663>`. A diagnostic's bound REDS
              # NOTHING, so neither cost a change to what this gate accepts.
              if [[ "$title_lc" =~ (^|[^0-9a-z_])dl-[0123456789]+ ]]; then
                echo "The title's 'DL-<number>' token is NOT a substitute and no longer satisfies this gate: a DL number is bound to no one card, so the writeback can resolve it to a DIFFERENT card and move that one while card $card_id never moves (card#10031). Keep the DL if it is relevant — it just cannot stand in for 'card#$card_id'."
              fi
              echo "Fix: add 'card-$card_id' to the PR title, then re-save (the 'edited' event re-runs this check)."
            fi
          elif [ -z "$selected" ]; then
            echo "::error::PR title carries card#$card_id, but the writeback parses no card token at all."
            echo "Branch '$BRANCH' targets card $card_id and the title names it, but not in a spelling the writeback parses (a glued 'card<id>' needs at least two digits), so merging this PR moves nothing."
            echo "Fix: write it as 'card#$card_id', then re-save (the 'edited' event re-runs this check)."
          else
            echo "::error::PR title carries card#$card_id, but that is NOT the card the writeback would move."
            echo "It selects card $selected from $selected_from — so merging this PR moves card $selected, and card $card_id never moves."
            echo "Presence is not selection: this gate used to check only that 'card#$card_id' appeared SOMEWHERE in the title, while the writeback takes the head ref's token first and otherwise the title's LEFTMOST one (card#10031)."
            if [ "$selected_surface" = head ]; then
              echo "Fix: rename the branch so the card token IN IT names card $card_id — the head ref outranks the title, so no retitling can clear this."
            else
              echo "Fix: make 'card#$card_id' the FIRST card token in the title — move any card you are citing descriptively after it, or drop it."
            fi
          fi
          exit 1

      - name: Require a closure claim on a card-correlating PR
        # THE OTHER HALF OF THE WRITEBACK CONTRACT (card#8294). The step above proves
        # a correlation token is PRESENT; this one proves the merge will actually
        # CLAIM the card's work is done. They are different propositions and only the
        # first had a check, so the second broke silently and stayed broken.
        #
        # WHAT WENT WRONG, measured: since DL-305/DL-308 a merge moves a card only on
        # CLOSURE evidence — the head ref names the card (structural) or the title
        # carries a closing form naming it (lexical). Neither is implied by the
        # correlation token this file already required. The house branch convention
        # flipped from `card-<id>-slug` to `<type>/<id>-slug` on 2026-08-29, which
        # silently removed the structural route from every PR, and the titles carried
        # a bare `(card#<id>)` — a CORRELATION, never a closure (DL-305). Result:
        # every merge logged `mention-vs-closure, DL-305/DL-308` and moved nothing,
        # 8 PRs in a row, each card corrected by hand. A THIRD spelling
        # (`card-sign-kbcard` — the `card` token with no digits) shows the same
        # refusal predates that flip. The dependency was declared nowhere and checked
        # nowhere; THAT is the root cause, and this step is the fix for it. The
        # convention itself is stated in CLAUDE_CONVENTIONS.md § Git / PR conventions.
        #
        # WHY A TITLE FORM RATHER THAN RENAMING THE BRANCHES BACK: the title is the
        # surface an author states intent on, it is already gated here, and it does
        # not strengthen branch-as-authority — which is the vector behind the
        # OPPOSITE defect a peer measured (a context branch necessarily names the card
        # it cites, so a context PR promoted work it did not do). Both routes stay
        # accepted; this only makes one of them checkable.
        #
        # ⚠ SCOPE, disclosed rather than discovered — this leg covers the CARD route
        # only. A title naming a `DL-<n>` that resolves to cards can be refused at
        # merge for exactly the same reason, and this step stays silent about it. That
        # is deliberate, not an oversight: measured over 120 merged PRs, 2 titles
        # carried a DL and no card token, BOTH on `card-*` branches (already closed
        # structurally), while the shape a DL arm would have to red — `(card#N,
        # DL-M)`, the DL cited as provenance beside the work's own card — occurs 4
        # times and closes nothing about the DL. A DL arm cannot tell those apart from
        # the title alone, so it would trade a silent miss for a false red on a
        # population of zero. `Closes DL-<n>` still closes at runtime; nothing here
        # asks for it.
        #
        # SECURITY: same posture as the steps above — TITLE and BRANCH are
        # PR-author-controlled, reach the script ONLY via the env: block, and are used
        # quoted. Never interpolated as ${{ }} inside run:. See DL-182.
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          # The third input, and the only one the steps above do not read: the
          # structural route is a property of the MERGE, not only of the ref, so
          # without it this step would mirror `PrOutcome::mergeClosesCard()` minus a
          # conjunct and call the difference an assumption. Not author-controlled in
          # the way the other two are — GitHub sets it from the PR's target — but it
          # is quoted on exactly the same terms.
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # The require step's exemption set, and here it earns a THIRD reason:
          # GitHub mints a revert PR's title by QUOTING the original's, so
          # `Revert "feat: x (closes card#1)"` carries a closing form for work this PR
          # UNDOES. This step must not demand one there.
          #
          # ⚠ THAT DISCLOSURE IS NOW DISCHARGED (card#8306), and the exemption stays for
          # its own reason. The runtime predicate used to read the quoted verb the same
          # way, so merging such a revert MOVED the card its work undid; `RevertGrammar`
          # now subtracts the quoted title from `ClosureGrammar` and refuses GitHub's
          # `revert-<n>-` ref in `PrOutcome::mergeClosesCard()`, on both the event path
          # and `bridge:reconcile`. This exemption never governed that — it governs what
          # CI DEMANDS — and it is still right: a revert is not required to claim a
          # closure, and now cannot accidentally make one either.
          case "$BRANCH" in
            dependabot/*|release/*|sync/*|revert-*)
              echo "Branch '$BRANCH' is exempt (automation/release/revert) — skipping."
              exit 0
              ;;
          esac

          # Folded once, like both steps above: the runtime grammars are /i, so a
          # title this step reds must be one the bridge would also have refused.
          title_lc=$(printf '%s' "$TITLE" | tr '[:upper:]' '[:lower:]')
          branch_lc=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]')

          # THE OPT-OUT, and the reason it must exist: a PR that cites a card for
          # CONTEXT and deliberately does not finish it is legitimate — demanding a
          # closure claim there would build the exact over-promotion defect this
          # design avoids, just with CI doing the pushing. A literal, unmistakable
          # marker in the title says so.
          #
          # ⛔ SINCE card#8344 / DL-327 THE WRITEBACK READS IT TOO, and the sentence
          # that stood here — "it suppresses this check, it does not instruct the
          # bridge; nothing at runtime reads it" — is SUPERSEDED. A PR carrying this
          # marker now takes NEITHER closure route at merge: the structural one
          # (`PrOutcome::mergeClosesCard()`) and the lexical one (`ClosureGrammar`)
          # both refuse it, so the card is correlated and stamped exactly as before
          # and simply not moved. ⛔ It still cannot INSTRUCT a move — it only ever
          # withholds one — which is why it is not the accept-surface DL-318 refused.
          #
          # ⚠ ONE LITERAL, TWO ENGINES. `App\Bridge\Support\NoCloseGrammar::MARKER`
          # owns the spelling and `PrTitleLintTest` ties this assignment to it,
          # comparing the two ANSWER SETS as well as the string: bash cannot read a
          # PHP constant, so the copy is GUARDED rather than deleted. The fold above
          # plus `grep -qF` is a fixed ASCII-folded substring test, which is exactly
          # what `stripos()` is on the PHP side.
          optout='[no-close]'
          if grep -qF "$optout" <<<"$title_lc"; then
            echo "Title carries ${optout} — this PR declares it does not finish the card it names, and since card#8344 the writeback honours it too (no stage move on merge). Skipping."
            exit 0
          fi

          # WHICH card this PR correlates, read the way the classifier reads it:
          # CardTokenGrammar::parse() is LEFTMOST-ONLY, so the first token in the
          # TITLE is the one that selects. Keyed on the title and not on the branch
          # shape deliberately — the branch-shape predicate belongs to the step above
          # and a second copy of it here is the restatement this file keeps paying for;
          # and it is the title that catches the `card-sign-kbcard` spelling, where the
          # branch names no id at all yet the title still correlates a card.
          #
          # A title with no card token correlates nothing, so no merge can withhold a
          # move: docs chores, dependabot bumps and every tokenless PR pass here
          # untouched.
          #
          # NOT kept in lockstep with CardTokenGrammar by discipline — PrTitleLintTest
          # SCANS every step for `good=` / `token=` and drives each one against that
          # grammar and against the others, so this file cannot hold card-token regexes
          # that disagree, however many it grows. ⚠ Byte-identical to the require
          # step's copy, and DELIBERATELY not hoisted to `env:` — the reason is at that
          # copy: the scan that ties them reads `run:` scripts, so a hoist removes the
          # tie, not the duplication.
          token='(^|[^0-9a-z_])card([-#]([0123456789]+)|([0123456789][0123456789]+))'
          if [[ ! "$title_lc" =~ $token ]]; then
            echo "Title names no card — nothing correlates, so no merge can withhold a move. Skipping."
            exit 0
          fi
          # Exactly one of the two arms captured; leading zeros fold, as the grammar's
          # own (int) cast folds them.
          card_id=$((10#${BASH_REMATCH[3]}${BASH_REMATCH[4]}))

          # ROUTE 1 — STRUCTURAL (DL-308): the HEAD REF itself names that card AND
          # the merge lands on the INTEGRATION branch. Both conjuncts, because
          # `PrOutcome::mergeClosesCard()` has both: a release merge takes this route
          # NOT AT ALL, so a card-token head targeting the release base closes nothing
          # and its author must be told, not silently passed. Pinned against
          # `PrOutcome::RELEASE_BASE` in PrTitleLintTest so the name cannot drift.
          release_base='main'
          if [ "$BASE" != "$release_base" ] \
            && [[ "$branch_lc" =~ $token ]] \
            && [ "$((10#${BASH_REMATCH[3]}${BASH_REMATCH[4]}))" -eq "$card_id" ]; then
            echo "OK: head branch '$BRANCH' names card $card_id — the merge closes it structurally."
            exit 0
          fi

          # ROUTE 2 — LEXICAL (DL-305): a closing verb with the token FLUSH against
          # it. This is ClosureGrammar::BRIDGE composed with
          # CardTokenGrammar::parseAnchored, in bash — a second implementation, tied
          # to the authority by answer set in PrTitleLintTest and not by discipline.
          # The adjacency is the whole predicate: `closes the bug in card#1` closes
          # nothing, here and at runtime, because the verb's object is not the token.
          # Matches are extracted rather than tested, so `closes card#1, closes
          # card#2` is read as the grammar reads it — one verb, one token, twice.
          #
          # ⛔ THE SEPARATOR IS ENUMERATED, NOT `[[:space:]]` — DL-272's ruling, on a
          # second bracket expression, for the same measured reason. GNU grep resolves
          # `[[:space:]]` from LOCALE DATA, and a runner's locale is not the C locale:
          # under `C.UTF-8` (the Actions default) and `en_US.UTF-8` it admits FOUR
          # separators the authority's `\s` rejects (PCRE without `/u`, DL-231) —
          # U+1680, U+2000, U+205F and U+3000 — while agreeing under plain `C`. So
          # `closes<U+3000>card#1` would have PASSED this gate and been REFUSED by the
          # bridge: a false green, in the one check whose entire purpose is to delete a
          # silent no-move. An enumerated class reads no locale data at all and cannot
          # acquire a fifth.
          #
          # ⚠ THE PRICE, measured and pinned rather than discovered: `\s` also admits
          # TAB/VT/FF/CR and this does not, so a TAB-separated closing form reds here
          # and closes at runtime. That is the FALSE-RED direction — loud, one retitle
          # away, and pinned in PrTitleLintTest so it cannot drift unobserved; VT/FF/CR
          # cannot reach a one-line PR title at all. A literal tab inside this YAML
          # scalar is the alternative, and it is an invisible character one editor away
          # from silently narrowing the gate.
          closure='(^|[^0-9a-z_])(close[sd]?|fix(e[sd])?|resolve[sd]?)[ :]+card([-#]([0123456789]+)|([0123456789][0123456789]+))'
          # The spellings quoted to the author. NOT a free restatement: PrTitleLintTest
          # requires ClosureGrammar to accept every form here AND `closure` above to
          # match each, and requires this list to name every verb stem the grammar
          # accepts — so a grammar move that adds or drops a verb reds the suite.
          forms='closes card#ID, closed card#ID, close card#ID, fixes card#ID, fixed card#ID, fix card#ID, resolves card#ID, resolved card#ID, closes: card#ID'
          while read -r hit; do
            hit_id=$(grep -oE '[0123456789]+$' <<<"$hit") || continue
            if [ "$((10#$hit_id))" -eq "$card_id" ]; then
              echo "OK: the title carries a closing form naming card $card_id."
              exit 0
            fi
          done < <(grep -oE "$closure" <<<"$title_lc" || true)

          echo "::error::This PR correlates card ${card_id}, but nothing in it claims that work is DONE — merging it will move NOTHING."
          echo "The bridge refuses the stage move and logs 'mention-vs-closure (DL-305/DL-308)': the card keeps its pr stamp, sits in In Review, and never advances. That happened on 8 consecutive PRs before this check existed (card#8294)."
          echo "⚠ A bare '(card#${card_id})' in the title is a CORRELATION, never a closure — it is exactly the shape that fails."
          echo "A merge closes a card by EITHER route:"
          echo "  LEXICAL    — a closing form in the TITLE, the token flush against the verb: ${forms//ID/$card_id}"
          echo "  STRUCTURAL — the HEAD BRANCH REF itself names the card (card-${card_id}-slug, glued card${card_id}-slug), merged to the integration branch — this PR targets '${BASE}'"
          echo "Fix: retitle to '<type>(<scope>): <subject> (closes card#${card_id})', then re-save (the 'edited' event re-runs this check)."
          echo "Deliberately NOT finishing this card (you cite it for context)? Put the literal ${optout} in the title. Since card#8344 (DL-327) BOTH layers read it as your declaration: this check stops asking, and the writeback WITHHOLDS the stage move on merge — the card is still correlated and still gets its pr stamp, it just does not advance. It can only ever withhold a move, never cause one."
          exit 1
