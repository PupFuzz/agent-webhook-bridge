name: Promote released cards on merge to main

# When a release merges to main, move each shipped DL's tracking card (board 8,
# the bridge's tracking board) to "released to main" (stage 53). The DL set is
# derived DETERMINISTICALLY from git (`git log <prev-tag>..HEAD`) by
# promote-released-cards, consumed as the SHA-pinned agent-board-toolkit
# composite action (uses: .../promote@<sha>; docs/INSTALL.md §6a in that repo).
# No copy is vendored here — the pin is bumped by dependabot. Closes the gap
# where a bundled release PR carries no single DL token. Board/stage/api come
# from .release-pr.json (.promote). Isolated so a card HICCUP never blocks the
# release — but NOT isolated from whether the release was actually TAGGED
# (card#8286): this workflow and `auto-tag-version.yml` share the `push: main`
# trigger with no `needs:` between them, so this one wins the race on EVERY
# release and used to stamp cards "Released to main" before the tag existed. The
# gate step below waits for the tag and refuses to promote if it never appears.
#
# workflow_dispatch lets an operator exercise the path on demand — dry-run by
# default, so it moves nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dls:
        description: 'DLs to promote (comma-separated). Blank = derive from the git range.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — report only, move nothing.'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: release-promote-cards-${{ github.sha }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # ⛔ ORDER IS THE POINT — this gate runs BEFORE anything that reports the release. A gate
      # placed after the promote step refuses a release the board has already been told shipped,
      # so the red run is about a state that now needs repairing by hand.
      #
      # WHY IT EXISTS. `auto-tag-version.yml` fires on the same `push: main` as an INDEPENDENT
      # run, so promote wins the race on every release and reported "Released to main" without
      # ever checking the tag. Measured in agent-board-toolkit on its v0.28.0 merge: auto-tag's
      # push took a 403, the tag never arrived, and its board asserted a shipped release for
      # 17m27s until a human re-ran the job (toolkit card#6579; adopted here as card#8286).
      #
      # WAIT-THEN-REFUSE, NOT REFUSE-ON-SIGHT. Because the two runs start together the tag is
      # legitimately absent for the first seconds of EVERY release; an immediate hard-refuse
      # would red them all. The bound, why it is what it is, and what happens when it is reached
      # are stated in the toolkit's `bin/release-tag-check` header and are deliberately NOT
      # restated here — they moved once already and every copy of them did not.
      #
      # A NON-RELEASE PUSH TO main ASSERTS NOTHING and exits 0 saying so: the gate delegates
      # "is this range a release" to `release-artifacts-check --classify-only`, which decides it
      # from .release-pr.json's version_file/version_regex read at BOTH ends of the range. Only a
      # push that moves VERSION is gated, so a direct docs push to main is not deadlocked.
      #
      # PRECONDITIONS, all already met above: the checkout's `fetch-depth: 0` (the classification
      # reads both ends of the range and refuses a shallow clone rather than reading it as "not a
      # release"), and the job's `permissions: contents: read`, which is UNCHANGED and sufficient
      # — the gate polls refs with `git ls-remote` and writes nothing. This repo leaves
      # .release-pr.json's `tag_format` unset, so the gate waits for `v<version>`, which is
      # exactly what auto-tag-version.yml creates; the two must move together if either changes.
      - name: Refuse to promote an untagged release
        # A workflow_dispatch run carries no before-ref, so it has no range to classify. That
        # path is operator-driven and dry-run by default, so it is skipped rather than gated.
        if: github.event_name == 'push'
        # A BACKSTOP, sized ABOVE the tool's own bound so the TOOL's bound fires first and the
        # job reports `failure`. A timeout-minutes kill reports `cancelled`, and a cancelled run
        # is not a refused release. ⇒ Do not tighten this from a figure written here — read the
        # worst case in `bin/release-tag-check`'s own header first.
        timeout-minutes: 10
        uses: PupFuzz/agent-board-toolkit/release-tag-check@d792a821537a3fbdd05a54357c2669626b1d627a  # v0.31.0
        with:
          before-sha: ${{ github.event.before }}
          after-sha: ${{ github.sha }}
          # config / remote / timeout / interval / read-timeout are left blank on purpose: blank
          # means the tool's own defaults, which is the one place those numbers are argued
          # (toolkit docs/INSTALL.md §6d). Setting one here would mint a copy free to drift.

      # Preflight the required repo variables (out-of-band from the PR-editable
      # .release-pr.json) so the failure is a clear ::error:: rather than the
      # action's script fail-closing on an empty value. The promote step itself
      # is the SHA-pinned agent-board-toolkit composite action (docs/INSTALL.md §6a) —
      # no vendored copy in this repo.
      - name: Preflight required repo variables
        env:
          KANBAN_API_BASE: ${{ vars.KANBAN_API_BASE }}
          KANBAN_EXPECTED_HOST: ${{ vars.KANBAN_EXPECTED_HOST }}
        run: |
          if [ -z "$KANBAN_API_BASE" ]; then
            echo "::error::vars.KANBAN_API_BASE is not set — refusing to promote against the .release-pr.json placeholder host. Set it with: gh variable set KANBAN_API_BASE --repo <owner>/<repo> --body 'https://<kanban-host>/api/v3'" >&2
            exit 1
          fi
          if [ -z "$KANBAN_EXPECTED_HOST" ]; then
            echo "::error::vars.KANBAN_EXPECTED_HOST is not set — promote requires it to validate the api host before sending the writeback token" >&2
            exit 1
          fi

      - name: Promote tracking cards
        uses: PupFuzz/agent-board-toolkit/promote@d792a821537a3fbdd05a54357c2669626b1d627a  # v0.31.0
        with:
          writeback-token: ${{ secrets.KANBAN_WRITEBACK_TOKEN }}
          expected-host: ${{ vars.KANBAN_EXPECTED_HOST }}
          api-base: ${{ vars.KANBAN_API_BASE }}
          dls: ${{ github.event.inputs.dls }}
          # Source-stage guard: only cards currently in Shipped-to-Dev (board 8
          # stage 52) are promoted; a matched card elsewhere is skipped, so a
          # stale/recycled DL or PR stamp can't resurrect a declined/backlog card.
          shipped-stage-ids: '52'
          dry-run: ${{ github.event.inputs.dry_run }}
