name: DL collision gate

# Refuses a PR that mints a `## DL-NNN` number already in use (card#7157).
#
# A duplicate DL number is silent, permanent and cross-cutting: nothing rejects
# it, review cannot see it (each PR's log is internally consistent), and once
# both entries land the decision log has two entries claiming one identifier —
# an identifier cited across repos, in card titles and in the writeback's own
# correlation grammar. Until this file existed the only in-repo way to pick a
# number was `max(^## DL-NNN) + 1` over one checkout, which cannot see an
# unpushed parallel mint. Measured near-miss 2026-08-21: two branches both read
# 290; the collision was avoided by accident.
#
# THE PREDICATE AND ITS STATED BOUND ARE OWNED BY `bin/decision-log.py`, in the
# `cmd_check` docstring, and are deliberately not restated here — a second copy
# of a guard's scope is exactly how a guard comes to claim more than it checks.
# Read it there before trusting this gate to have caught anything. The one line
# worth repeating at the door, because it is the bound people assume away:
# TWO OPEN PRs THAT EACH MINT THE SAME NEW NUMBER BOTH PASS. Neither number is
# on the target branch yet.
#
# NO `paths:` FILTER, DELIBERATELY. A `paths:` key is static YAML evaluated
# before any job exists, so nothing this workflow runs can observe it; a filter
# that stops covering the decision log makes this gate ABSENT rather than red,
# and an absent check reports nothing (measured on provision-tools-python.yml —
# see DL-283). The job is seconds long and exits 0 on a PR that mints nothing,
# so there is no cost worth buying that failure mode with.
#
# SECURITY: nothing author-controlled reaches a `run:` body by interpolation.
# The base ref and the PR head SHA arrive through `env:` and are used quoted
# (DL-182/DL-284); the base snapshot is derived from git, not from the payload.

on:
  pull_request:
    # `edited` is absent on purpose: this gate reads the decision log and the
    # target branch, never the PR title, so a title edit changes none of its
    # inputs. `synchronize` is load-bearing — a re-push is what re-reads the
    # target branch tip, and re-reading it is the only way the second of two
    # concurrently-minted numbers is ever caught.
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  dl-collision-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # REQUIRED: the step reads the decision log at the base snapshot it
          # derives from the checked-out merge commit (`HEAD^1` — NOT the merge
          # base; see the step below) and at the live target-branch tip. A shallow
          # clone has neither, and it must not be shallow enough to truncate the
          # merge's first parent either.
          fetch-depth: 0

      - name: A DL number this PR mints is not already in use
        shell: bash
        env:
          # The PR head sha is the SECOND leg of the pairing check in
          # bin/pr-base-snapshot.sh: it is what proves the merge at HEAD is a
          # merge of THIS PR. The base snapshot is NOT an input any more — it is
          # derived from HEAD, for the measured reason in the step body.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          LOG=CLAUDE_DECISIONS.md
          work=$(mktemp -d)

          # THE BASE SNAPSHOT IS `HEAD^1`, derived by bin/pr-base-snapshot.sh:
          # the FIRST PARENT of the merge commit actions/checkout leaves in the
          # work tree. That script owns the derivation for every gate in this repo
          # that needs a base, so there is one place where this is stated and one
          # place where it can be wrong.
          #
          # THE PAIRING IS THE INVARIANT, and it is what makes the `added` set
          # below mean "what this PR mints". `--head` is the WORKING TREE, and for
          # a `pull_request` event actions/checkout leaves that at `github.sha` —
          # the merge commit GitHub computed for THIS event, the PR head merged
          # into the base commit that merge records as its first parent. Head and
          # base are therefore ONE snapshot of the base branch plus this PR, so a
          # number present at head and absent here was minted by this PR. Hand the
          # step two INDEPENDENTLY-SOURCED commits and that stops being true: pair
          # this head with the FORK POINT and every entry the base branch gained
          # after the fork is inside the merge tree at head, absent at the fork
          # point, and read as this PR's mint — the predicate returns 6 and the
          # step refuses an innocent PR. `DlCollisionGateTest`'s pairing case runs
          # exactly that as its control.
          #
          # ⛔ MEASURED 2026-09-02 (card#8527), and it is why this line no longer
          # reads `github.event.pull_request.base.sha`. GitHub does NOT refresh
          # that field on every `synchronize`, so it can LAG the base tip the
          # merge commit was actually built on — the two are not one snapshot, and
          # nothing in the payload says when they diverge. On PR #640, run
          # 33598959720, the event carried `base.sha` 549c894 while the merge
          # commit 642decf that same event checked out has first parent 7a11085
          # (`dev`'s tip once #639 had merged). The pairing broke exactly as the
          # paragraph above says it would: this step read `dev`'s own DL-335 as a
          # number THIS PR minted and refused an innocent PR. DL-295 bound (f)
          # named the shape as unverifiable-from-here; this is its measurement,
          # and the fix is to stop taking the claim from the payload. `HEAD^1`
          # cannot lag: it is the base commit the merge itself records.
          #
          # ⚠ WHY A `git merge-base "$BASE" HEAD` "CORRECTION" WOULD STILL BE
          # WRONG — the warning is unchanged, and `HEAD^1` is NOT that correction.
          # `merge-base` RE-DERIVES a base from whatever head it is handed, so the
          # first caller whose head is NOT this merge (a `push`-triggered run, a
          # local invocation, a re-pointed fixture) silently gets the fork point
          # and the false refusal above; and it is INERT while the pairing holds
          # (`$BASE` is then an ancestor of the merge, so `merge-base` returns
          # `$BASE`), so no test would say so. `HEAD^1` computes nothing — it
          # READS the base out of the merge commit — and when the work tree is not
          # that merge, bin/pr-base-snapshot.sh fails LOUD rather than
          # substituting a guess. Say what the input IS; do not re-derive it. The
          # predicate's own statement of this contract lives on `cmd_check` in
          # bin/decision-log.py.
          BASE=$(bin/pr-base-snapshot.sh "$HEAD_SHA")
          git show "$BASE:$LOG" > "$work/base.md"

          # The log at the LIVE tip of the branch being merged into, fetched
          # fresh rather than read from `$BASE`: the whole point of the second
          # assertion is to see an entry the target branch gained AFTER the base
          # snapshot above — after the merge commit was built, now that the
          # snapshot is `HEAD^1` — which is by definition not in either file the
          # gate already holds.
          git fetch --no-tags --quiet origin "+refs/heads/$BASE_REF:refs/remotes/dl-gate/$BASE_REF"
          git show "refs/remotes/dl-gate/$BASE_REF:$LOG" > "$work/target.md"

          rc=0
          python3 bin/decision-log.py check \
            --head "$LOG" --base "$work/base.md" --target "$work/target.md" || rc=$?

          case "$rc" in
            0)
              ;;
            5)
              echo "::error::this PR's $LOG uses one DL number twice (the number is named above)."
              echo "Two entries claiming one identifier is permanent once merged: every citation of"
              echo "that number becomes ambiguous, in this repo and in every repo that cites it."
              echo "Fix: allocate a fresh number with 'python3 bin/decision-log.py next' and renumber"
              echo "the entry, its CHANGELOG line, its commit messages and the PR title together."
              exit 1
              ;;
            6)
              echo "::error::this PR mints a DL number that is already in use on $BASE_REF (named above)."
              echo "The number was free when this branch was cut and has been taken since — the case a"
              echo "'max + 1' scan of your own checkout structurally cannot see (card#7157)."
              echo "Fix: allocate a fresh number with 'python3 bin/decision-log.py next' and renumber"
              echo "the entry, its CHANGELOG line, its commit messages and the PR title together."
              exit 1
              ;;
            *)
              echo "::error::bin/decision-log.py exited $rc — unexpected; treat as a gate failure."
              echo "An unreadable decision log must not be reported as a clean one."
              exit 1
              ;;
          esac
