name: DL collision gate

# Refuses a PR that mints a `## DL-NNN` number already in use (card#7157).
#
# A duplicate DL number is silent, permanent and cross-cutting: nothing rejects
# it, review cannot see it (each PR's log is internally consistent), and once
# both entries land the decision log has two entries claiming one identifier —
# an identifier cited across repos, in card titles and in the writeback's own
# correlation grammar. Until this file existed the only in-repo way to pick a
# number was `max(^## DL-NNN) + 1` over one checkout, which cannot see an
# unpushed parallel mint. Measured near-miss 2026-08-21: two branches both read
# 290; the collision was avoided by accident.
#
# THE GATE IS AGENT-BOARD-TOOLKIT'S (card#12338): its `dl-collision-gate`
# composite action, pinned by SHA below. The grammar, the predicate and its
# stated bound are owned by the toolkit's `bin/_decision-log.py` docstring at the
# pinned SHA, and the steps (the base snapshot, the live-target fetch, the exit
# mapping) by `bin/dl-collision-gate --help` there. Neither is restated here — a
# second copy of a guard's scope is exactly how a guard comes to claim more than
# it checks. The one line worth repeating at the door, because it is the bound
# people assume away: TWO OPEN PRs THAT EACH MINT THE SAME NEW NUMBER BOTH PASS.
# Neither number is on the target branch yet.
#
# The allocator stays in this repo — `python3 bin/decision-log.py next` (DL-295)
# — and reads headers through that same toolkit grammar.
#
# NO `paths:` FILTER, DELIBERATELY. A `paths:` key is static YAML evaluated
# before any job exists, so nothing this workflow runs can observe it; a filter
# that stops covering the decision log makes this gate ABSENT rather than red,
# and an absent check reports nothing (measured on provision-tools-python.yml —
# see DL-283). The job is seconds long and exits 0 on a PR that mints nothing,
# so there is no cost worth buying that failure mode with.
#
# SECURITY: nothing author-controlled reaches a `run:` body by interpolation.
# The base ref and the PR head SHA are action INPUTS, which the action hands its
# script through `env:` (DL-182/DL-284); the base snapshot is derived from git,
# not from the payload.

on:
  pull_request:
    # `edited` is load-bearing: retargeting a PR to another base branch fires
    # ONLY `edited`, and the target branch is one of this gate's inputs, so
    # without it a retargeted PR keeps a verdict judged against the old target.
    # A title or body edit fires it too, which is harmless (a seconds-long job,
    # no PR-controlled code run). `synchronize` is load-bearing — a re-push is
    # what re-reads the target branch tip, and re-reading it is the only way the
    # second of two concurrently-minted numbers is ever caught.
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  dl-collision-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # REQUIRED: the gate reads the decision log at the merge commit's first
          # parent and at the live target-branch tip, and a shallow clone has
          # neither. Keep the DEFAULT ref as well: on a pull_request event it is
          # the refs/pull/N/merge commit, the only work tree the gate accepts.
          fetch-depth: 0

      # Pin maintained by dependabot's github-actions ecosystem (see .github/dependabot.yml).
      # ⚠ The same SHA is the `ref:` in .github/actions/agent-board-toolkit/action.yml,
      # which dependabot does not bump; DlCollisionGateTest reds until the two agree.
      - uses: PupFuzz/agent-board-toolkit/dl-collision-gate@fa5a08b037afede671e57055e274e625cfc3e5d0  # v0.51.0
        with:
          head-sha: ${{ github.event.pull_request.head.sha }}
          base-ref: ${{ github.event.pull_request.base.ref }}
