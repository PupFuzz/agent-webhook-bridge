# This repo's adoption of the release-artifact gate (card#5910). The class rule: every member
# of a must-move-together set is READ by the guard and a missing member FAILS the PR — a guard
# reading a proper subset cannot fail on the member it never reads. `changelog-gate.yml`
# (DL-276) reads two of this repo's three declared members, `VERSION` and the
# `docs/CHANGELOG.md [<VERSION>]` section, plus the release-body size limit that this action
# does not check; the third, the `CLAUDE.md § Recent releases` row, is read by nothing. The two
# gates COMPOSE — neither replaces the other. This one takes its members from
# `.release-pr.json`'s `artifacts` array, which until now merely PRINTED them as a checklist, so
# a fourth member is guarded by DECLARING it rather than by remembering to extend a script.
# Post-merge auto-tag workflows stay fail-soft BY DESIGN (ratified on card#5910); this asserts
# at release-PR time, where the fix is a commit rather than a retag.
#
# No paths filter: the gate must observe EVERY pull request to classify it. Classification is
# by version VALUE, so a non-release PR exits 0 after two `git show`s.
name: Release artifacts

on:
  pull_request:
    # `edited` fires when a PR is RETARGETED to a different base, and the verdict is a function of
    # the base — the merge base drives both the classification and the asserted diff. Not for the
    # title, which this action never reads (unlike changelog-gate.yml, which subscribes to the
    # same event for exactly that reason).
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Required by the action: it resolves the FORK POINT of base and head, reads the
          # version file at both ends and each artifact's contents at head through `git show`,
          # none of which a shallow clone can serve. The base-deriving step below needs the
          # merge commit's first parent for the same reason.
          fetch-depth: 0

      # THE BASE SNAPSHOT THE ACTION IS HANDED, derived here rather than taken from
      # `github.event.pull_request.base.sha` (card#8527). GitHub does not refresh that
      # field on every `synchronize`, so it can LAG the base tip the checked-out merge
      # commit was built on — measured on PR #640, run 33598959720, 2026-09-02:
      # `base.sha` 549c894 against a merge commit whose first parent was 7a11085.
      # ⚠ THIS CALL SITE HAD NO LIVE RED ON THAT SHAPE, and it is moved for ONE
      # derivation across four callers, not to fix one. The action's own contract
      # (`action.yml` at the pinned sha) consumes `base-sha` ONLY through
      # `merge-base(base, head)`, and a lagging base cannot move that fork point
      # unless the PR branch has itself merged the base — measured: a branch cut
      # at B0 while the base advanced to B1 has merge-base(B0,H) == merge-base(B1,H)
      # == B0. Only a branch that merged B1 differs (merge-base(B0,H) = B0 while
      # merge-base(B1,H) = B1), and there the stale sha puts the base's own B0..B1
      # commits inside the range this gate asserts on. `HEAD^1` is the base commit
      # the merge itself records, so it cannot lag on either shape; the script
      # fails loud rather than substituting a guess when the work tree is not that
      # merge. The action is pinned by sha and lives in another repo, so the
      # derivation lands at the CALL SITE — the input — not inside the action. The
      # identical `base-sha` input on the toolkit's and kanban-board's own
      # release-artifacts-gate.yml has that same NARROW exposure (branch merged the
      # base), not the PR #640 one; those are their repos' cards, at that shape.
      - name: Derive the base snapshot from the checked-out merge commit
        id: pr-base
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha=$(bin/pr-base-snapshot.sh "$HEAD_SHA")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Pin maintained by dependabot's github-actions ecosystem (see .github/dependabot.yml)
      # — it has opened a bump PR for this action on the weekly cadence since adoption, so a
      # pin behind the toolkit's newest tag is a between-runs lag, not an unmaintained pin.
      - uses: PupFuzz/agent-board-toolkit/release-artifacts@d792a821537a3fbdd05a54357c2669626b1d627a  # v0.31.0
        with:
          base-sha: ${{ steps.pr-base.outputs.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
