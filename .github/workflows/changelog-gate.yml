name: CHANGELOG gate

# ONE file, TWO assertions about docs/CHANGELOG.md — deliberately not two
# workflows (card#5910, card#5971, card#5972 were approved as one change):
#
#   1. RELEASE PR — a PR that moves VERSION must carry a `## [<VERSION>]`
#      section, and that section must fit GitHub's release-body limit.
#      Both halves are the same defect class: until this file existed,
#      `auto-tag-version.yml` was the only automation reading VERSION and the
#      CHANGELOG together, and it runs POST-merge, where the tag has already
#      landed — which is the whole reason this one exists. A missing section
#      there only WARNs and publishes a placeholder; an oversize section
#      hard-fails after the tag is pushed, leaving the release tagged but
#      unpublished (measured: v0.72.0, run 31051259223, HTTP 422). Asserting
#      here moves both to the point where the fix is still cheap.
#
#   2. FEATURE PR — a PR touching an in-scope file must be named in the
#      `[Unreleased]` section. The step's own PATH SCOPE comment owns the
#      criterion and enumerates the members; this line deliberately does not
#      carry a second copy of that list. Measured 2026-08-05: 25 of 56
#      tokened commits reached v0.72.0 undocumented, against 100% coverage on
#      the prior three releases, because nothing reads the CHANGELOG on a PR
#      event at all.
#
# NOT in scope, and do not "also" add it: `auto-tag-version.yml` staying
# fail-soft on the TAG half is by design (card#5910 rejected hardening it) —
# failing there would leave a merged release untagged.
#
# SECURITY: the PR title and head branch are author-controlled. They reach the
# scripts ONLY via `env:` and are used quoted — never interpolated as ${{ }}
# inside a `run:` body (the Actions script-injection class; DL-182).
#
# THE BASE SNAPSHOT IS DERIVED, NOT TAKEN FROM THE PAYLOAD (card#8527). `$BASE`
# is `HEAD^1` — the base commit the merge actions/checkout leaves in the work
# tree RECORDS — read by `bin/pr-base-snapshot.sh`.
# `github.event.pull_request.base.sha` is NOT that commit: GitHub does not
# refresh it on every `synchronize`, and it was measured lagging by one merge on
# PR #640 (run 33598959720, 2026-09-02), which made dl-collision-gate.yml refuse
# an innocent PR. A SCOPE diff's two ends must be ONE snapshot or the verdict is
# about a tree nobody pushed, so both scope diffs run `$BASE` -> the WORK TREE.
#
# `$HEAD` — the PR BRANCH TIP — is still an input, and is a different question,
# not a second spelling of the same one. The pre-fold diagnosis asks where the
# branch STARTED and what the branch ADDS to the base's text; both are
# properties of the branch's own history, which the merge commit's first-parent
# chain does not carry. It is also the leg `bin/pr-base-snapshot.sh` checks the
# derivation against: HEAD^2 must BE `$HEAD`, or the work tree is not this PR's
# merge and no verdict is reported at all.

on:
  pull_request:
    # `edited` is load-bearing for the feature-PR step: the correlation token
    # comes from the PR TITLE, so a title fix must re-run the check.
    # `synchronize` is load-bearing for both: the diff is what they read.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  changelog-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # REQUIRED: both steps diff base..head, and the feature-PR step also
          # reads the changelog AT THE BASE. A shallow clone has neither.
          fetch-depth: 0

      - name: Release PR — VERSION has a CHANGELOG section that fits the release-body limit
        shell: bash
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # ONE SNAPSHOT, BOTH ENDS (card#8527). `HEAD` — the git revision, not
          # `$HEAD` — is the merge commit actions/checkout left here, and `$BASE`
          # is that merge's own first parent, so `$BASE` -> `HEAD` is exactly
          # what this PR adds to the base branch. NOT
          # `github.event.pull_request.base.sha`: it lags (measured on PR #640 —
          # see the file header), and a base that is not this head's own parent
          # makes the base branch's post-fork changes read as this PR's.
          BASE=$(bin/pr-base-snapshot.sh "$HEAD")

          # Classified by "does this PR move VERSION?", NOT by the base ref.
          # That is circular for the guard that asks whether a feature PR
          # wrongly bumped, but it is not circular here: this assertion IS
          # "whenever the version moves, its section must exist", so the
          # version moving is exactly the trigger. It also means the release
          # branch's TWO PRs (into the integration branch, then into the
          # release branch) are both covered without naming either branch.
          # The diff is captured FIRST rather than piped into grep. Under
          # `pipefail`, `writer | grep -q` reports the WRITER's status when grep
          # exits on its first match and the writer dies of SIGPIPE — measured:
          # `seq 1 5000000 | grep -qxF 3` yields 141 on a successful match. Here
          # that would read as "VERSION is not in the diff" and skip the whole
          # assertion, silently, on exactly the large PRs most worth checking.
          # `core.quotepath=false` sits at the CAPTURE, not at the predicate: by
          # default git prints any path carrying a non-ASCII byte as a C-quoted
          # string with a LEADING `"`, which silently defeats a predicate that
          # anchors or matches whole lines. The `-qxF VERSION` below cannot be
          # fooled that way — an ASCII literal is never quoted. The flag is here
          # anyway because THIS file's predicates demonstrably get rewritten
          # (card#6056 rewrote the feature step's scope predicate), so the read is
          # fixed once at the guard rather than re-argued at whichever predicate
          # moves next. Scoped to this guard: NOT a claim that every path-list
          # read in the repo wants the flag — DL-281's sibling audit found one
          # that provably does not.
          CHANGED=$(git -c core.quotepath=false diff --name-only "$BASE" HEAD)
          if ! grep -qxF VERSION <<<"$CHANGED"; then
            echo "OK: this PR does not move VERSION — no release section to assert."
            exit 0
          fi

          V=$(tr -d '[:space:]' < VERSION)
          echo "VERSION moves in this PR; asserting docs/CHANGELOG.md carries [$V]."

          rc=0
          python3 bin/changelog-section.py \
            --changelog docs/CHANGELOG.md --section "$V" --enforce-limit >/dev/null || rc=$?

          case "$rc" in
            0)
              echo "OK: docs/CHANGELOG.md carries a [$V] section within the release-body limit."
              ;;
            3)
              echo "::error::docs/CHANGELOG.md has no '## [$V]' section, but this PR bumps VERSION to $V."
              echo "The version bump and its CHANGELOG entry travel together (VERSIONING.md rule 3)."
              echo "Post-merge, auto-tag-version.yml would tag the release and publish a placeholder"
              echo "note in place of the entry — a green signal over a missing one."
              echo "Fix: fold the [Unreleased] content into a '## [$V] - YYYY-MM-DD' heading."
              exit 1
              ;;
            4)
              echo "::error::the '## [$V]' section is larger than GitHub can publish as a release body."
              echo "auto-tag-version.yml would tag $V and then fail to create its Release (HTTP 422),"
              echo "leaving the release tagged but unpublished — the v0.72.0 failure."
              echo "Fix: trim the section — the per-PR entries it folds in are the bulk. There is NO"
              echo "accept-and-proceed path: this arm always exits 1, so re-running without trimming"
              echo "returns 4 again. Recurring cost is tracked as card#7511."
              exit 1
              ;;
            *)
              echo "::error::bin/changelog-section.py exited $rc — unexpected; treat as a gate failure."
              exit 1
              ;;
          esac

      - name: Feature PR — the change is named in the CHANGELOG [Unreleased] section
        shell: bash
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # ONE SNAPSHOT, BOTH ENDS — the release step above owns the reason.
          # This step uses `$BASE` three ways: the scope diff and the `git show`
          # of the base's own [Unreleased] section pair it with the WORK TREE,
          # while the pre-fold diagnosis pairs it with `$HEAD`, the branch tip,
          # because it asks about the BRANCH's history rather than about this
          # PR's net change. The file header owns which question is which.
          BASE=$(bin/pr-base-snapshot.sh "$HEAD")

          # Same exemption set as pr-title-lint.yml, for the same reasons:
          # dependabot and revert PRs carry no card, and release/sync PRs are
          # the events that CONSUME [Unreleased] rather than add to it.
          case "$HEAD_REF" in
            dependabot/*|release/*|sync/*|revert-*)
              echo "OK: branch '$HEAD_REF' is exempt (automation/release/revert)."
              exit 0
              ;;
          esac

          # PATH SCOPE, as approved on card#5971 and widened on card#6056,
          # card#6100 (DL-282) and card#6137. It has TWO halves, from two
          # separate rulings:
          #
          #   SOFTWARE half (DL-276) — the shipped code.
          #   CI half (DL-280, widened by DL-282 then by card#6137) — what CI
          #   ACCEPTS OR REJECTS, which is shipped behaviour for a contributor:
          #   a tightened gate changes what they must do to merge exactly as an
          #   app/ change changes what the software does. Measured: the DL-279
          #   release-artifacts-gate adoption changed what CI accepts on every
          #   release PR and was structurally exempt from the gate that exists
          #   to make a change announce itself.
          #
          # NEITHER half is claimed complete, and this list is the MEMBERS, not
          # the closure of either criterion. Known outside it:
          #
          #   * config/, routes/ and database/migrations/ on the SOFTWARE half —
          #     a bound inherited from DL-276, disclosed in DL-282, and neither
          #     introduced nor fixed by card#6137 (DL-288).
          #   * examples/channel-servers/package.json and its package-lock.json
          #     on the CI half. NEWLY disclosed by DL-288 rather than inherited,
          #     and on the same mechanism that puts composer.lock in this list:
          #     channel-server-supply-chain.yml runs `npm ci --ignore-scripts`
          #     (which fails the PR on manifest/lock drift) and
          #     `npm audit --audit-level=high`, reading the lockfile as that
          #     gate's own RULE INPUT, and its version-bump job reads BOTH
          #     files' `version` fields as rule inputs (it fails the PR when
          #     they disagree, or when a shipped change leaves them unbumped);
          #     provision-tools-python.yml runs a second `npm ci` against the
          #     same lockfile. card#6137 owns the disposition. Widening to reach
          #     the pair is itself a change to what CI rejects, so it needs its
          #     own operator ruling — this is a disclosure, not an oversight.
          #
          # DL-282's three disclosed CI-half gaps (composer.json, composer.lock,
          # .env.example) are members as of DL-288, so THAT disclosure is
          # discharged — which closes the gaps DL-282 NAMED and is NOT the same
          # as closing the CI half: this list is not claimed to exhaust that
          # criterion, and the npm pair above is a live instance of the
          # difference. Do not read this list as asserting anything else is out
          # of reach of the criterion.
          #
          # The members:
          #   app/                 the shipped code
          #   bin/                 the shipped scripts
          #   .github/workflows/   the checks themselves
          #   .github/actions/     the composite action both laravel-tests.yml
          #                        jobs run; it pins PHP 8.5, the extension set
          #                        and the composer install
          #   .release-pr.json     VERSIONING.md calls its `artifacts` array
          #                        the authority for the member list that
          #                        release-artifacts-gate.yml enforces
          #   phpstan-laravel.neon the analyser's own `level` and `paths`
          #   pint.json            the style `preset` and `exclude`
          #   phpunit.xml          <testsuites> decides which tests RUN AT ALL,
          #                        so deleting an entry drops a whole directory
          #                        from CI with nothing else in the diff
          #   composer.json        its require-dev pins the analysers the
          #                        PHPUnit+Pint+PHPStan job RUNS out of
          #                        vendor/bin (pint, larastan, phpunit) and
          #                        require pins the platform php, so a bump
          #                        here changes what CI accepts directly; the
          #                        setup-app composite also runs composer
          #                        install with scripts ENABLED, and the psr-4
          #                        map drives the autoloader both test jobs load
          #   composer.lock        security.yml runs composer audit --locked, so
          #                        the lockfile is that gate's RULE INPUT:
          #                        changing it flips the gate red or green
          #   .env.example         the setup-app composite copies it to .env, so
          #                        it is the environment both test jobs run
          #                        under
          #
          # The ROOT FILES — every member above with no trailing `/` — match as
          # WHOLE paths (`^…$`) while the directory members match as prefixes.
          # (Stated as a rule rather than a count: a count is a scope fact the
          # derivation leg does not cover, so a later widening would leave it
          # false at green.) Two regimes, and each anchor stops a
          # DIFFERENT lookalike: without the trailing `$`, `phpunit.xml.dist`
          # matches; without the leading `^`, `config/pint.json` matches. Both
          # are pinned, by two separate mutations — neither anchor covers the
          # other's case.
          #
          # They sit in a SECOND alternation with its own `^`…`$` purely to keep
          # the two regimes visually apart. That is a READABILITY choice, not a
          # portability one: POSIX allows an anchor anywhere outside a bracket
          # expression in an ERE (the ends-only rule is BRE), so a single group
          # `^(app/|pint\.json$)` is equally valid — verified identical under
          # GNU grep 3.11, under POSIXLY_CORRECT=1, and under busybox grep. The
          # split form itself puts a `^` immediately after a `|`, so no dialect
          # argument could favour it anyway. Do not "fix" it back citing
          # portability.
          #
          # ACCEPTED BOUND: phpunit.xml also carries a <php><env> block that is
          # test-fixture config rather than policy, and a file-level predicate
          # cannot split those regions — the identical coarse-predicate
          # tradeoff DL-280 already took for `.github/workflows/`.
          #
          # A docs-only or test-only PR is still exempt BY CONSTRUCTION rather
          # than by a carve-out, because a gate that fires on changes with
          # nothing to announce is one people learn to bypass.
          #
          # ONE operator-facing spelling of the member list, interpolated into
          # all three messages below. A per-message copy is the enumeration
          # drifting from the regex — the defect class this scope exists to
          # close. Shell variable only; the file-header SECURITY block owns the
          # interpolation rule.
          SCOPE='(app/, bin/, .github/workflows/, .github/actions/, .release-pr.json, phpstan-laravel.neon, pint.json, phpunit.xml, composer.json, composer.lock, .env.example)'

          # Captured, not piped — see the release step for the measured reason a
          # `writer | grep -q` under pipefail can report the writer's SIGPIPE.
          # `core.quotepath=false` because git's default C-quotes any path with a
          # non-ASCII byte and prints it with a LEADING `"`, which defeats the
          # `^` below: a PR whose in-scope paths were ALL non-ASCII-named was
          # exempted from this gate silently (measured: a commit touching only
          # `app/café.php` matched 0 times, 1 with the flag; `app/plain.php`
          # matched under both). Residual, bounded in DL-281 rather than claimed
          # closed: a path containing `"`, `\`, or a control byte is quoted
          # regardless of this flag.
          # ⚠ DISCLOSED BY card#8339 / DL-329, AND ITS MEASURED SHAPE NO LONGER
          # REPRODUCES HERE — read both halves. The disclosure was that this
          # TWO-DOT diff, on a branch forked before the base moved, reports the
          # BASE's own changes as this PR's, pulling a PR into the entry
          # requirement on the strength of somebody else's change. That was
          # measured against `"$BASE" "$HEAD"` — two commits sourced
          # independently, neither containing the other. card#8527 replaced BOTH
          # ends: `$BASE` is now `HEAD`'s own first parent, so this diff is the
          # merge's delta and the base's post-fork changes are on both sides of
          # it. `ChangelogGateTest`'s fork-then-base-moved case pins that, with
          # the retired pairing as its control.
          #
          # ⛔ WHAT IS NOT DECIDED HERE: whether the predicate should be
          # three-dot. That is card#8441's own approved change and its own
          # ruling — this comment is a note that the correction may now be a
          # no-op for THIS pairing, not a closure of it. Do not read the
          # paragraph above as "card#8441 is done".
          CHANGED=$(git -c core.quotepath=false diff --name-only "$BASE" HEAD)
          if ! grep -qE '^(app/|bin/|\.github/workflows/|\.github/actions/)|^(\.release-pr\.json|phpstan-laravel\.neon|pint\.json|phpunit\.xml|composer\.json|composer\.lock|\.env\.example)$' <<<"$CHANGED"; then
            echo "OK: this PR changes no in-scope file ${SCOPE} — no [Unreleased] entry required."
            exit 0
          fi

          rc=0
          head_unreleased=$(python3 bin/changelog-section.py \
            --changelog docs/CHANGELOG.md --section Unreleased) || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::docs/CHANGELOG.md has no '## [Unreleased]' section."
            echo "Every release re-seeds an empty one (VERSIONING.md § Release flow step 4);"
            echo "without it there is nowhere for a per-PR entry to go."
            exit 1
          elif [ "$rc" -ne 0 ]; then
            # A wrong-but-specific cause is worse than an honest generic one: an
            # unreadable changelog must not be reported as an absent section.
            echo "::error::bin/changelog-section.py exited $rc reading docs/CHANGELOG.md — unexpected."
            exit 1
          fi

          # PRE-FOLD DIAGNOSIS (card#8339). Both failure arms below reach the
          # SAME verdict for two causes that need opposite remedies, and the
          # message used to name only one of them:
          #
          #   * the entry was never written  -> "add an [Unreleased] entry"
          #   * the entry was written, and a release fold landed while the
          #     branch was open -> it is now under `[X.Y.Z]`, and adding a
          #     SECOND one leaves the released section claiming work it did not
          #     ship. The remedy is a MOVE, and the old text asked for the
          #     opposite. Measured on run 33544122079: card#8351's entry was
          #     standing under `[0.80.0]` while the gate told the author to add
          #     one citing `card#8351`.
          #
          # The fold renames `## [Unreleased]` to `## [X.Y.Z]` and opens a fresh
          # empty one above it. The branch side of that text is UNCHANGED, so
          # git's 3-way merge has no reason to move the entry — it stays exactly
          # where it sat, which is now below the version heading. No conflict,
          # no author error, and it recurs for every in-flight branch at every
          # release.
          #
          # THIS READS THE MERGED TREE, which is what makes the diagnosis
          # possible: on a `pull_request` event `actions/checkout` checks out
          # `refs/pull/<n>/merge` (measured in the same run — `git checkout
          # --force refs/remotes/pull/628/merge`), so `docs/CHANGELOG.md` in the
          # working tree is already the merge of base and head. That is the same
          # file `head_unreleased` above was computed from, deliberately: a
          # diagnostic carved from a second reading could contradict the verdict
          # it is explaining.
          #
          # The NEEDLES are the lines the BRANCH adds — the three-dot
          # `$BASE...$HEAD`, which diffs from the MERGE-BASE, not `$BASE..$HEAD`,
          # which reports the base's own changes as this branch's (measured on
          # --name-only: a branch touching one file is reported as touching the
          # base's too). Merge-base is the right anchor HERE and the wrong one
          # for the fold predicate below, and the two are not the same question:
          # this one asks what the branch ADDS to the base's text, which a merge
          # of the base does not change; that one asks where the branch STARTED,
          # which a merge of the base does.
          # `--baseline` then drops any needle the base already had, so a shared
          # `### Fixed` head cannot pass for a misfiled entry.
          #
          # ⚠ THE THREE-DOT WAS UNPINNED UNTIL LEG 3 EXISTED, and this file said
          # so: swapping it for `..` was mutated in and the suite stayed GREEN,
          # because the two filters made the forms agree on the NEEDLES — a
          # `..`-only extra needle is a line the base DELETED after the fork,
          # which the merge deletes too, so it is never in the merged section.
          # THAT IS NO LONGER TRUE, and the reason is the `-` side: under `..`
          # the base's own fold shows up as a DELETION of `## [X.Y.Z] - <date>`,
          # which is the first line of that section on the base, so leg 3 fires
          # on every genuinely pre-fold branch and the diagnosis is thrown away.
          # Mutated in and measured: RED ×3, all three pre-fold fixtures.
          #
          # It NEVER changes the verdict — the gate has already decided to fail
          # when this runs, and every arm below still exits 1. It only chooses
          # which remedy is printed, so what CI accepts is byte-for-byte what it
          # accepted before.
          #
          # Callers use `heading=$(prefold_heading) || heading=''`, which
          # collapses EVERY non-zero rc — rc 3 (no released section carries a
          # branch line) and a tooling failure alike mean "this diagnosis is not
          # established", and the remedy for an unestablished diagnosis is the
          # one that was always printed. Naming a cause we cannot verify would
          # be the worse failure.
          #
          # THE LABEL IS NOT THE DIAGNOSIS. "A line this branch adds sits in a
          # released section" is also true of THREE shapes where the fold
          # sentence below is FALSE, each measured as a fixture:
          #
          #   * the branch CORRECTS a line inside a section that already stood at
          #     its FORK POINT (the stale-fix shape) — the message would date a
          #     fold to a window it did not happen in, and would tell the author
          #     to lift a SHIPPED line out of a release;
          #   * the branch CUTS the section itself — a PR that adds
          #     `## [X.Y.Z]` and files under it is told that X.Y.Z "was cut while
          #     this branch was open" by somebody else;
          #   * the branch forked PRE-fold, MERGED the folded base — the remedy's
          #     own first instruction — and THEN corrected a line inside the
          #     just-folded section. No reading of the history excludes this one;
          #     LEG 3 below is why.
          #
          # So the fold is asserted, not inferred, and the predicate has THREE
          # legs. Legs 1 and 2 ask about the HISTORY: the heading must exist on
          # the BASE and must NOT have existed at the branch's FORK POINT — i.e.
          # it appeared during this branch's life, which is what "the branch
          # predates the fold" means. Both reads go through the same extractor as
          # the label, never a `grep '## [x]'`: a second carve of the section
          # boundary is DL-276's defect class one level down.
          #
          # THE FORK POINT, NOT `git merge-base`. They differ on exactly the
          # shape this remedy creates: the remedy's own first step is "merge the
          # base branch", and a branch that merges it makes the base its OWN
          # merge-base, so the fold heading stands in the merge-base tree and a
          # merge-base predicate goes false — answering the author who has just
          # done what the gate asked with the generic "add an [Unreleased]
          # entry", which docs/CHANGELOG.md itself names as the exact opposite of
          # the right move. Where the branch STARTED is the question, and a merge
          # is not a re-fork, so the fork point is what answers it. Both shapes
          # are fixtures in ChangelogGateTest.
          #
          # LEG 3 — THE BRANCH DELETES NO LINE OF THAT SECTION AS THE SECTION
          # STANDS ON `$BASE`. This is a THIRD QUESTION, not a tighter spelling
          # of the first two, and the third shape above is why: legs 1-2 settle a
          # fact about the HISTORY, while the remedy makes a claim about a LINE —
          # "the fold carried YOUR entry into [X.Y.Z], so move it out". A branch
          # that forked pre-fold, merged the folded base and then edited a line
          # inside the just-folded section satisfies both history legs and
          # falsifies that claim, and NO reading of the three trees can separate
          # them: fork point, base and merged tree are byte-identical whether the
          # fold CARRIED that line in or the author WROTE it there after merging.
          # The `-` SIDE of the diff is what differs — correcting a shipped line
          # DELETES it, and a fold carries lines in while deleting none. So a
          # branch that removes a line the released section carries on the base
          # has not established this diagnosis, and the arm prints what it always
          # printed. "Restricted to that section" IS the comparison: the section
          # body comes from the same extractor read leg 1 makes, so no section
          # boundary is re-derived here either.
          #
          # ⚠ BLANK LINES ARE DROPPED FROM THE `-` SIDE, and that filter is
          # load-bearing rather than tidy: `grep -x -f` takes an empty pattern
          # line as matching every empty line, and every section body has blank
          # lines in it, so without the filter a branch that deletes ONE blank
          # line anywhere in the changelog would lose its diagnosis. Pinned by a
          # fixture that deletes exactly that.
          #
          # RESIDUALS — the shapes that establish no diagnosis, so the arm
          # prints the message it always printed. ⛔ THE LIST IS NOT KEPT HERE.
          # DL-329 (Decision 6) is its ONE copy, and docs/CHANGELOG.md and
          # VERSIONING.md already point at that copy instead of restating it; a
          # second enumeration at this surface is that same drift one level
          # down, and it had already happened — the copy that stood here and
          # DL-329's differed in membership, and BOTH stated a residual for
          # `branch_fork_point` that measurement then falsified (review round
          # 4). Whoever edits these legs owes DL-329 the update.
          #
          # WHAT PRINTS whenever a leg is unestablished is the generic "add an
          # [Unreleased] entry" arm, and on a branch that IS genuinely pre-fold
          # that is not "a message that is still correct" — it is the wrong
          # instruction, the one this whole diagnostic exists to stop giving.
          # The trade is taken anyway: the other direction asserts a fold nobody
          # established and sends the author to edit a RELEASED section.
          # Unhelpful beats confidently wrong, and the residual is stated rather
          # than claimed harmless.
          #
          # 0 = the section stands in that file · 1 = it does not · 2 = the
          # question was not answered. The third state is kept APART from the
          # second because the caller INVERTS one of these reads: collapsing
          # every non-zero rc to "absent" lets a tooling failure satisfy the
          # fork-point leg and print the fold remedy off an error.
          #
          # `$3` is where the section BODY lands when the caller wants it (leg 3
          # compares against the base's section). It is the same read, not a
          # second one: two extractor calls over one file could be made to
          # disagree by anything that edits the file between them, and the body
          # leg 3 subtracts from must be the body leg 1 accepted.
          changelog_has_section() {
            local rc=0
            # stderr to /dev/null EXPLICITLY, not `2>&1`: with `$3` set that
            # would fold the extractor's diagnostics into the section body.
            python3 bin/changelog-section.py --changelog "$1" --section "$2" >"${3:-/dev/null}" 2>/dev/null || rc=$?
            case "$rc" in
              0) return 0 ;;
              3) return 1 ;;
            esac
            diagnosis_unavailable "bin/changelog-section.py exited ${rc} reading ${1}"
            return 2
          }

          # LEG 3, with the same three-state rc discipline for the same reason —
          # the caller inverts this read too. 0 = the branch deletes at least one
          # line of that section · 1 = it deletes none · 2 = the question was not
          # answered (grep's own rc 2: an unreadable input, never a verdict).
          # `-x` because a section line is a whole line, and `-F` because a
          # changelog bullet is text, not a pattern.
          branch_deletes_from_section() {
            local rc=0
            grep -qxF -f "$1" -- "$2" || rc=$?
            case "$rc" in
              0) return 0 ;;
              1) return 1 ;;
            esac
            diagnosis_unavailable "grep exited ${rc} comparing the branch's deletions against [${3}]"
            return 2
          }

          # The label read, with the same rc discipline: rc 3 is the ordinary
          # "no released section carries a branch line" and is not a fault, so it
          # is silent; anything else is a tooling failure that would otherwise
          # vanish into `|| heading=''` with no trace in the log.
          locate_added_label() {
            local rc=0 out=''
            out=$(python3 bin/changelog-section.py --changelog docs/CHANGELOG.md \
              --locate-added "$1" --baseline "$2" 2>/dev/null) || rc=$?
            case "$rc" in
              0) printf '%s\n' "$out"; return 0 ;;
              3) return 3 ;;
            esac
            diagnosis_unavailable "bin/changelog-section.py --locate-added exited ${rc}"
            return "$rc"
          }

          # STDERR, not stdout: this runs inside `heading=$(prefold_heading)`,
          # whose stdout is the label itself. The runner reads workflow commands
          # off both streams, so the notice still reaches the log — which is the
          # point, since the caller's `|| heading=''` is deliberately silent
          # about WHY a diagnosis was not established.
          diagnosis_unavailable() {
            echo "::notice::changelog pre-fold diagnosis unavailable: $1" >&2
          }

          # The commit this branch was cut from: the parent of the OLDEST commit
          # on the branch's OWN first-parent line. `--topo-order` never prints a
          # parent before its child, so the last entry has no parent inside the
          # set; `--first-parent` is what makes that set the BRANCH's line
          # rather than everything the range happens to contain. A refusal
          # returns non-zero rather than guessing.
          #
          # ⚠ WITHOUT `--first-parent` THIS SILENTLY ANSWERS ABOUT A DIFFERENT
          # BRANCH — measured, not argued (review round 4). A branch that forked
          # AFTER the fold and whose own FIRST commit merges a still-unmerged
          # sibling carries that sibling's commits inside `$HEAD ^$BASE`, and the
          # oldest commit in that RANGE is then the SIBLING's first commit. It
          # has exactly one parent, so the ≠1-parent refusal below never fires,
          # and the function returns the SIBLING's fork point — pre-fold — for
          # a branch that forked after the fold, at which point the gate asserts
          # "the branch predates the fold" at a branch that does not. Pinned by
          # a fixture; dropping `--first-parent` reds it.
          #
          # ⚠ AND THE OBVIOUS POST-HOC CHECK DOES NOT DISCRIMINATE, which is why
          # the walk is fixed instead: the fork point this returns is a
          # base-side commit in BOTH the right and the wrong reading, so it lies
          # on `$HEAD`'s first-parent chain either way (measured in the same
          # cell). The commit the fork point is taken FROM is what differs.
          #
          # This also settles what `--topo-order` alone left to an ordering git
          # does not document — which ROOT of a multi-root range comes last. A
          # first-parent walk is one chain, so there is no root to choose among.
          # DL-329 records the re-derivation over this repo's own PR ranges.
          branch_fork_point() {
            local first
            first=$(git rev-list --topo-order --first-parent "$HEAD" ^"$BASE" | tail -1)
            [ -n "$first" ] || return 1
            # `<commit> <parent>` is two words: exactly one parent, so `$first^`
            # names a fork point rather than choosing between merge parents.
            [ "$(git rev-list --parents -n 1 "$first" | wc -w)" -eq 2 ] || return 1
            git rev-parse "${first}^"
          }

          prefold_heading() {
            local dir rc=0 fork_rc=0 del_rc=0 label='' fork=''
            dir=$(mktemp -d)
            {
              # ONE diff, both sides read off it: the `+` side is the needles and
              # the `-` side is leg 3, and a second `git diff` could answer a
              # question the first one did not.
              # `--output-indicator-old='<'` because the `-` side is the one
              # whose misreads are UNSAFE: with the default indicator a deleted
              # line spelled `-- text` prints as `--- text` and is indistinguish-
              # able from the `--- a/path` header, and skipping it would hide a
              # deletion — i.e. KEEP a diagnosis leg 3 would have dropped. The
              # `+` side keeps the default: there a missed line is a lost needle,
              # which drops the diagnosis, and that is the safe direction.
              git -c core.quotepath=false diff --no-color --output-indicator-old='<' \
                "$BASE...$HEAD" -- docs/CHANGELOG.md >"$dir/diff" &&
              awk '/^\+\+\+ /{next} /^\+/{print substr($0, 2)}' "$dir/diff" >"$dir/added" &&
              # Blank deletions dropped — see the LEG 3 comment: an empty pattern
              # line makes `grep -x -f` match every blank line in the section.
              awk '/^</{ line = substr($0, 2); if (line ~ /[^[:space:]]/) print line }' \
                "$dir/diff" >"$dir/deleted" &&
              git show "$BASE:docs/CHANGELOG.md" >"$dir/baseline" &&
              label=$(locate_added_label "$dir/added" "$dir/baseline") &&
              fork=$(branch_fork_point) &&
              git show "$fork:docs/CHANGELOG.md" >"$dir/forkpoint" &&
              changelog_has_section "$dir/baseline" "$label" "$dir/basesection" &&
              # NOT `! changelog_has_section …`: `!` maps rc 2 to success, which
              # is how a tooling failure would come out as "the fold was absent".
              # Only rc 1 — the extractor's own "no such section" — means that.
              { changelog_has_section "$dir/forkpoint" "$label" || fork_rc=$?; } &&
              [ "$fork_rc" -eq 1 ] &&
              # Inverted for the same reason, and refused the same way: only
              # grep's own rc 1 means "this branch deletes nothing from it".
              { branch_deletes_from_section "$dir/deleted" "$dir/basesection" "$label" || del_rc=$?; } &&
              [ "$del_rc" -eq 1 ]
            } || rc=$?
            rm -rf "$dir"
            [ "$rc" -eq 0 ] || return "$rc"
            printf '%s\n' "$label"
          }

          # ONE spelling of the remedy, for both arms below. A guard's
          # remediation string is a doc surface, so a per-arm copy is two
          # versions of one instruction free to drift — the same reason `SCOPE`
          # above is a variable rather than three literals. `$2` is the only
          # thing the two arms genuinely differ on: the tokened arm can name the
          # entry, the tokenless one cannot.
          prefold_remedy() {
            local heading="$1" what="${2:-your entry}"
            echo "Your entry is under [${heading}] because the branch predates the fold — move it under [Unreleased]."
            echo "v${heading} was cut while this branch was open. The fold renamed the [Unreleased] heading your"
            echo "entry sits under and opened a fresh empty one above it, so merging leaves the entry inside a"
            echo "RELEASED section — which then claims work that did not ship in it."
            echo "Fix: merge the base branch, then MOVE ${what} out of [${heading}] and into [Unreleased]."
            echo "Do NOT write a second entry: that leaves the first one corrupting [${heading}]."
          }

          # The correlation token comes from the PR TITLE, which pr-title-lint
          # requires for any branch that NAMES a card id — so the two gates
          # compose: that one proves the token is present, this one proves the
          # token is documented.
          #
          # WHICH branches name one is owned by that file's own predicate and is
          # deliberately not restated here. The spelling this comment used to
          # carry (`<type>/<card-id>-slug`) was exactly the accept-set the house
          # convention then drifted away from, and this copy of it would have gone
          # stale in lockstep with the gate it described (card#6822).
          #
          # Digit classes are ENUMERATED, never written as [0-9]: inside bash's
          # [[ =~ ]] a bracket RANGE is resolved by COLLATION, and under an
          # ordinary en_US.UTF-8 runner [0-9] admits non-ASCII digits that the
          # card grammar correlates to nothing (DL-272). The negated classes
          # below are ranges on purpose — there, collation reds instead of
          # greening.
          D='[0123456789]'
          title_lc=$(printf '%s' "$TITLE" | tr '[:upper:]' '[:lower:]')

          kind=''
          id=''
          if [[ "$title_lc" =~ (^|[^0-9a-z_])card[-#]($D+)([^0-9]|$) ]]; then
            kind=card; id="${BASH_REMATCH[2]}"
          elif [[ "$title_lc" =~ (^|[^0-9a-z_])card($D$D+)([^0-9]|$) ]]; then
            # The glued form takes 2+ digits (DL-233); `card4` names no card.
            kind=card; id="${BASH_REMATCH[2]}"
          elif [[ "$title_lc" =~ (^|[^0-9a-z_])dl-($D{1,4})([^0-9]|$) ]]; then
            kind=dl; id="${BASH_REMATCH[2]}"
          fi

          section_lc=$(printf '%s' "$head_unreleased" | tr '[:upper:]' '[:lower:]')

          if [ -n "$kind" ]; then
            # Normalize away leading zeros so the pattern below is symmetric: a
            # title spelling `DL-0276` must match a changelog spelling `DL-276`
            # exactly as `DL-276` matches `DL-0276`. Without this the padded
            # direction works and the unpadded one silently does not.
            id=$((10#$id))
            case "$kind" in
              card) pat="(^|[^0-9a-z_])card[-#]?0*${id}([^0-9]|\$)"; spelling="card#${id}" ;;
              # The log header and PR titles write DL-275 while the card
              # payload zero-pads to DL-0275; accept either spelling.
              dl)   pat="(^|[^0-9a-z_])dl-0*${id}([^0-9]|\$)"; spelling="DL-${id}" ;;
            esac
            if grep -qE "$pat" <<<"$section_lc"; then
              echo "OK: the [Unreleased] section names this PR's ${kind} token ${id}."
              exit 0
            fi
            echo "::error::this PR changes an in-scope file ${SCOPE}, but docs/CHANGELOG.md's [Unreleased] section does not name ${kind} ${id}."
            heading=$(prefold_heading) || heading=''
            if [ -n "$heading" ]; then
              prefold_remedy "$heading" "the '${spelling}' entry"
              exit 1
            fi
            echo "Nothing reads the CHANGELOG between PRs, so an omission is invisible until a release is cut:"
            echo "25 of 56 tokened commits reached v0.72.0 undocumented this way (card#5971)."
            echo "Fix: add an [Unreleased] entry citing '${spelling}' describing the change."
            exit 1
          fi

          # TOKENLESS DISPOSITION — decided explicitly (card#5971 required this
          # to be a decision, not the script's silence). A PR that reaches here
          # has no card and no DL in its title AND is not on an exempt branch,
          # so there is no key to look for. Demanding a token would widen what
          # CI requires beyond pr-title-lint's own rule (which deliberately
          # skips branches with no card id in them). Requiring only that the
          # section MOVED keeps the floor — the change announces itself — while
          # leaving the token convention exactly where it already is.
          base_unreleased=$(git show "$BASE:docs/CHANGELOG.md" | python3 bin/changelog-section.py \
            --changelog - --section Unreleased) || base_unreleased=''
          if [ "$head_unreleased" != "$base_unreleased" ]; then
            echo "OK: no correlation token in the title, but this PR changed the [Unreleased] section."
            exit 0
          fi
          echo "::error::this PR changes an in-scope file ${SCOPE} and leaves docs/CHANGELOG.md's [Unreleased] section untouched."
          heading=$(prefold_heading) || heading=''
          if [ -n "$heading" ]; then
            prefold_remedy "$heading"
            exit 1
          fi
          echo "Its title carries no card#/DL token, so there is nothing to correlate against — the entry"
          echo "is the only signal that this change exists before a release is cut."
          echo "Fix: add an [Unreleased] entry (and, if the work has a card, put its token in the PR title"
          echo "so this check can verify the entry names it)."
          exit 1
