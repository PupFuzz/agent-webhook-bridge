name: CHANGELOG gate

# Every card shipped since the last `v*` tag owns a bullet under `## [Unreleased]`
# in docs/CHANGELOG.md, plus the per-repo legs `.release-pr.json`'s `changelog`
# block turns on. The rule and every key are the toolkit's: `bin/changelog-gate
# --help` at the pinned SHA owns them (card#11684). VERSIONING.md § What CI
# enforces says what this repo configures.
#
# ⛔ The job id `changelog-gate` is a REQUIRED status check on `dev` and `main`.
# Renaming it leaves every PR waiting on a check that never reports.

on:
  push:
    branches: [main, dev]
  pull_request:
    # `edited` fires on a TITLE edit, and the PR title is an obligation source.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  changelog-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # REQUIRED by the gate: every commit since the last tag, every tag, and
          # `origin/dev` for a release PR's config read. Keep the default ref — on a
          # pull request it is the merge commit the gate judges.
          fetch-depth: 0

      # The base handed to the action is the merge commit's own first parent, not
      # `github.event.pull_request.base.sha`, which can lag it (card#8527; the
      # release-artifacts-gate.yml comment owns the measurement). A push event
      # carries no PR, so both steps are skipped and the action runs as a push run.
      # bin/pr-base-snapshot.sh runs the toolkit's tool from the checkout this
      # action makes (card#12338).
      - uses: ./.github/actions/agent-board-toolkit
        if: github.event_name == 'pull_request'

      - name: Derive the base snapshot from the checked-out merge commit
        if: github.event_name == 'pull_request'
        id: pr-base
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha=$(bin/pr-base-snapshot.sh "$HEAD_SHA")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Pin maintained by dependabot's github-actions ecosystem (see .github/dependabot.yml).
      - uses: PupFuzz/agent-board-toolkit/changelog-gate@6086d4995d0f58d8e61bc47bf57986619b939778  # v0.49.0
        with:
          base-sha: ${{ steps.pr-base.outputs.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          pr-title: ${{ github.event.pull_request.title }}
          head-ref: ${{ github.event.pull_request.head.ref }}
