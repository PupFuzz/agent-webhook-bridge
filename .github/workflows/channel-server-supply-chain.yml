name: Channel-server supply chain

# Guards the committed examples/channel-servers/ dependency tree (the reference
# Claude Code channel MCP server that reads a bearer token + accepts loopback
# POSTs as the agent's OS user — a real trust boundary, so a pinned + reviewed
# tree matters). Four checks:
#   1. `npm ci` — fails if package.json and package-lock.json have drifted
#      (the committed lockfile must stay reproducible: lock regenerated whenever
#      the dep range changes).
#   2. `node --test tests/` — the channel server's unit harness. Its sharpest leg is
#      the marker-refusal regression suite for the FR #2444 refuse-and-exit paths: a
#      refuse path that stops writing its `.FAILED` marker leaves a seat invisibly
#      deaf to live-wake, so this fails the PR the moment that contract regresses.
#      Every file in the suite imports `tests/live-state-guard.mjs`, which sandboxes
#      the channel-addressing env and FAILS the run if the seat's real runtime dir
#      changed (DL-269) — these tests spawn the real server, and its marker path
#      falls back to the ambient environment.
#   3. `npm audit` — FAILS loudly on a high/critical CVE in the pinned tree, so a
#      vulnerable-but-pinned dependency can't rot silently (the "degraded states
#      must be loud" posture). You then bump the dep + re-commit the lock.
#   4. version-bump-guard — consumers COPY this dir into their own deployment
#      (per the README), so a downstream snapshot drifts silently when these
#      files change. Two assertions: FAILS a PR that touches a shipped
#      channel-server file without bumping package.json `version` — the one field
#      a snapshot can compare to detect drift (DL-038) — and FAILS whenever
#      package-lock.json's version disagrees with it, since the field is a signal
#      only while every file that states it agrees (DL-268).
#
# Cost-scoped on purpose: only fires when the example actually changes (PR path
# filter) plus a weekly cron to catch newly-disclosed CVEs without a code change.

on:
  pull_request:
    paths:
      - 'examples/channel-servers/**'
      - '.github/workflows/channel-server-supply-chain.yml'
  schedule:
    - cron: "23 5 * * 1"   # Mondays 05:23 UTC (off-peak; offset from the other crons)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  channel-server-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: examples/channel-servers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: examples/channel-servers/package-lock.json

      - name: Reproducible install (fails on package.json/lock drift)
        run: npm ci --ignore-scripts

      - name: Unit tests (node --test)
        run: node --test tests/

      - name: Audit the pinned tree (fail on high/critical CVE)
        run: npm audit --audit-level=high

  version-bump-guard:
    # Consumers copy examples/channel-servers/ into a per-deployment (often
    # per-agent) snapshot, so a change to a shipped file drifts every copy with
    # no detectable signal. Require a package.json `version` bump on any shipped
    # change, so a snapshot can detect staleness by comparing one field (DL-038),
    # AND require package-lock.json to carry that same version — the field is only
    # a signal while every file that states it agrees (DL-268).
    # PR-only: the cron / workflow_dispatch runs have no base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # need the merge-base to diff base..head

      # Both files carry the snapshot version and only `npm version` /
      # `npm install` move them together, so a hand-edited manifest drifts the
      # lock silently — measured at 0.7.1 against a manifest that reached 0.8.3
      # across roughly a dozen green bumps (card#5232). Deliberately NOT
      # diff-gated like the bump step below: agreement is a property of the tree,
      # so there is no shape of diff that earns an exemption from it. Drift can
      # only ENTER through a PR touching these files, and the workflow's own
      # `paths:` filter already fires on every such PR.
      - name: Require the lockfile version to agree with the manifest version
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(jq -r '.version' examples/channel-servers/package.json)
          if [ "$manifest" = 'null' ] || [ -z "$manifest" ]; then
            echo "::error::examples/channel-servers/package.json has no version field. DL-038 makes that field the staleness signal a downstream snapshot reads, so its absence is a failure, not an exemption."
            exit 1
          fi
          for site in '.version' '.packages[""].version'; do
            lock=$(jq -r "$site" examples/channel-servers/package-lock.json)
            if [ "$lock" != "$manifest" ]; then
              echo "::error::examples/channel-servers/package-lock.json $site is '$lock' but package.json version is '$manifest'. Resync at the current version with: cd examples/channel-servers && npm install --package-lock-only — or bump both with npm version <next> --no-git-tag-version."
              exit 1
            fi
          done
          echo "lockfile version agrees with package.json: '$manifest'"

      - name: Require a package.json version bump when shipped files change
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Shipped files only: exclude the gitignored node_modules (never copied).
          changed=$(git diff --name-only "$BASE_SHA"...HEAD -- examples/channel-servers/ \
            | grep -v '/node_modules/' || true)
          if [ -z "$changed" ]; then
            echo "No shipped channel-server files changed — version bump not required."
            exit 0
          fi
          echo "Changed channel-server files:"; printf '  %s\n' $changed
          old=$(git show "$BASE_SHA:examples/channel-servers/package.json" 2>/dev/null | jq -r '.version' || echo '')
          new=$(jq -r '.version' examples/channel-servers/package.json)
          if [ "$old" = "$new" ]; then
            echo "::error::examples/channel-servers/ changed but package.json version is still '$new'. Bump it so downstream snapshots can detect drift (DL-038): cd examples/channel-servers && npm version <next> --no-git-tag-version"
            echo "On a lockfile-only dependency PR (dependabot cannot bump the manifest, so this leg is red by construction) the maintainer adds that ONE command as a commit on the PR branch. Do not exclude the lockfile from this guard: a transitive bump changes what 'npm ci' installs, which is exactly the artifact drift the version signals (DL-268)."
            exit 1
          fi
          echo "package.json version bumped: '$old' -> '$new' ✓"
