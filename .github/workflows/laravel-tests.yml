name: Laravel Tests

# CI for the v0.12 Laravel app (the sole test workflow since the Python tree
# was removed in Phase 3). Four checks: Pint (style), PHPStan/larastan level 7
# on app/Bridge, doc-sync (bin/check-doc-refs.php), and PHPUnit across SQLite
# plus the MariaDB matrix below.
#
# No runtime version literals in this comment, deliberately — a restated version
# drifts from the pin it restates. Laravel and PHPUnit are pinned in
# composer.json, PHP in .github/actions/setup-app, MariaDB in this file's own
# `matrix.mariadb`. Read the pin, don't re-state it here.
#
# Shared runtime setup (PHP + composer + .env) lives in the local composite
# action .github/actions/setup-app so the SQLite and MariaDB jobs can't drift.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    # NO paths filter — deliberately. These three jobs are REQUIRED status checks
    # in dev/main branch protection, so they must run and report on EVERY PR. A
    # paths-ignore (e.g. skipping docs-only PRs) makes the required check never
    # report on those PRs, which permanently BLOCKS them. The suite is fast
    # (~30s/job); running it on a docs PR is cheaper than the block. Don't re-add
    # a paths filter without also dropping these from the required-checks set.

# Cancel in-flight CI on rapid PR pushes; push events to main/dev run to
# completion (matches the Python Tests/Security workflows).
concurrency:
  group: laravel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phpunit:
    # DO NOT put a version — of PHP, MariaDB or anything else — in this job's
    # name. It is a required-status-check context pinned in BOTH dev and main
    # branch protection, so the name is an IDENTIFIER, not a description.
    # Coupling it to a runtime version makes every version bump a gated
    # branch-protection op: rename without the paired
    # `required_status_checks.contexts` update and protection waits forever on a
    # check that never reports, blocking every PR on both branches — including
    # the renaming one. The version this job actually runs is pinned in
    # .github/actions/setup-app and is the single source of truth for it.
    # This name was decoupled precisely so that op is paid once, not per bump.
    # See DL-040.
    name: PHPUnit + Pint + PHPStan (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-app

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: PHPStan (app/Bridge + CheckCommand, level 7)
        run: vendor/bin/phpstan analyse -c phpstan-laravel.neon --no-progress

      - name: Doc-sync (references resolve, no line citations, no unbounded coverage claims)
        run: php bin/check-doc-refs.php

      - name: PHPUnit (SQLite in-memory)
        run: vendor/bin/phpunit

  phpunit-mariadb:
    name: PHPUnit (MariaDB ${{ matrix.mariadb }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mariadb: ["10.6", "11"]

    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
          MARIADB_DATABASE: agent_webhook_bridge_ci
          MARIADB_USER: ci_user
          MARIADB_PASSWORD: ci_user_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15

    env:
      # Override phpunit.xml's sqlite default (non-forced <env> entries, so
      # the real environment wins) to exercise the MariaDB driver path.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: agent_webhook_bridge_ci
      DB_USERNAME: ci_user
      DB_PASSWORD: ci_user_password

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-app

      - name: Verify MariaDB connectivity
        run: php artisan db:show

      - name: PHPUnit (MariaDB)
        run: vendor/bin/phpunit
