name: doc-fence secret backstop

# ⚠ THIS CHANGES WHAT CI REJECTS. A PR whose markdown puts a secret VALUE on a
# readable surface inside a shell code fence now fails here. Operator-approved on
# card#8351; DL-324 carries the ruling and the bound.
#
# IT IS A BACKSTOP AND IT SAYS SO EVERYWHERE — do not let it be read as the rule.
# The rule is `docs/config-schema.md` § "Handling a secret VALUE (not just its
# file)", stated over the SURFACE (stdout, an argv, a log, shell history) precisely
# because the next instrument that resolves a secret is never on anyone's list.
# DL-321 DECLINED a lint on exactly that ground and the objection still stands: a
# grep over spellings greens on the instrument nobody enumerated. What reversed the
# decline is a measurement, not a refutation — all five known members of the class
# sat in markdown shell fences and none in code, so this catches 5/5 of the
# population that has actually occurred. A green run here is NOT evidence the class
# is absent, and the tool prints that sentence on every run including the clean ones.
#
# ⛔ THERE IS DELIBERATELY NO `paths:` FILTER, and that is the whole design.
# A filter is a static enumeration GitHub evaluates before any job exists, so
# nothing this workflow runs can check it; when it stops covering a file the gate
# does not go red, it goes ABSENT, and an absent check reports nothing. This repo
# has already paid for that once — provision-tools-python.yml's filter omitted
# `app/**`, a guard was moved out from under itself, and `dev` sat red unseen (see
# that file's header). Filtering THIS job would be the same mistake with worse
# irony: a backstop against a class that exists because enumerations are always one
# item behind, gated by an enumeration. The cost of not filtering is one ~15-second
# job on every PR — checkout plus a stdlib python run over ~30 markdown files, no
# composer, no npm, no node. That is the right price.
#
# WHY NOT FOLD IT INTO AN EXISTING JOB. `provision-tools-python.yml` runs this
# tool's UNIT TESTS (it discovers every `bin/test_*.py`, so they were wired in by
# existing) — but its `paths:` filter is scoped to bin/, app/ and the channel
# servers, so a PR touching only `docs/` cannot make it fire, which is exactly the
# PR this gate exists for. Widening that filter to `**.md` would put a second,
# unverifiable enumeration in a file whose header already explains why its one
# remaining copy had to be made detectable from outside. A separate unfiltered job
# needs no filter at all.
#
# WHAT IT CANNOT CATCH, stated here because a check's own file is where a reader
# looks for its bounds: anything outside a markdown shell fence — a `.php`, a
# `.sh`, a workflow `run:` block, a hook script, a four-space INDENTED code block,
# or prose (`docs/multi-host.md`'s 401 table row, DL-321's third site, was prose
# and would not have been caught) — and any spelling the tool's vocabulary does not
# know. Its own docstring owns the full bound list; this comment does not restate it.

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  doc-secret-fences:
    name: shell fences in *.md resolve no secret VALUE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Stdlib only — no setup-python, no pip, nothing to pin. `-VV` records the
      # interpreter so a future reader can tell what actually ran.
      - name: Scan every *.md for a secret VALUE on a readable surface
        shell: bash
        run: |
          set -euo pipefail
          python3 -VV
          python3 bin/check-doc-secret-fences.py .
