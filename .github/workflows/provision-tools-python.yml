name: bin/ python unit tests

# The standalone stdlib-Python operator tools under bin/ — the provisioning program
# bin/provision-board-tools.py (FR #5010), its same-box one-shot wrapper
# bin/provision-board-tools-samebox.py (card 5090), the seat-side channel-server
# launch-assert bin/check-channel-snapshot.py (card 5143, DL-237), and the shared
# CHANGELOG extractor bin/changelog-section.py (DL-276) that auto-tag-version.yml
# and changelog-gate.yml both call — carry red-when-reverted unit tests. This job
# runs them in CI so the "CI-tested" guarantee the designs rest on is real, not
# decorative.
#
# ⚠ THE MODULE LIST IN THE FINAL STEP IS A THIRD COPY of the two path filters
# below, and adding a bin/ tool means editing all three. That enumeration drifts
# by construction (card#5977) — a tool added to only two of the three either
# never runs or runs on the wrong events.
#
# ⚠ `app/**` IS IN THE FILTER, AND IT IS LOAD-BEARING — do not "tidy" it out as
# unrelated to bin/. `bin/test_check_channel_snapshot.py` asserts about `app/` PHP
# SOURCE SHAPE: the snapshot probe's no-exec tripwire and the string-only call-site
# tripwire both read `app/` files. While the filter listed only bin/ + the channel
# server, no `app/`-only PR could run this job — so the DL-242 stage-7 migration moved
# the probe's call site out from under its own guard, reddened these tests, and merged
# anyway because the job that would have caught it was structurally unable to fire.
# `dev` then stayed red and unseen (the push: filter had the same gap) until an
# unrelated PR happened to touch examples/channel-servers/**. A check that cannot run
# on the change that invalidates it is a decoration. The cost is this job running on
# app/ PRs — seconds — and that is the correct price for the guarantee.
#
# Node is set up because check-channel-snapshot.py's suite LAUNCHES a real channel
# server: the tool's whole claim is that launching is more precise than enumerating
# files, and a mocked launch would assert the mock. Its cases skip LOUDLY (a banner on
# stderr) rather than silently if node is ever missing.

on:
  pull_request:
    paths:
      - 'bin/provision-board-tools.py'
      - 'bin/test_provision_board_tools.py'
      - 'bin/provision-board-tools-samebox.py'
      - 'bin/test_provision_board_tools_samebox.py'
      - 'bin/check-channel-snapshot.py'
      - 'bin/test_check_channel_snapshot.py'
      - 'bin/changelog-section.py'
      - 'bin/test_changelog_section.py'
      - 'app/**'
      - 'examples/channel-servers/**'
      - '.github/workflows/provision-tools-python.yml'
  push:
    branches: [dev, main]
    paths:
      - 'bin/provision-board-tools.py'
      - 'bin/test_provision_board_tools.py'
      - 'bin/provision-board-tools-samebox.py'
      - 'bin/test_provision_board_tools_samebox.py'
      - 'bin/check-channel-snapshot.py'
      - 'bin/test_check_channel_snapshot.py'
      - 'bin/changelog-section.py'
      - 'bin/test_changelog_section.py'
      - 'app/**'
      - 'examples/channel-servers/**'
      - '.github/workflows/provision-tools-python.yml'

permissions:
  contents: read

jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
      # WITHOUT THIS THE ONLY CASE THAT EXERCISES THE SHIPPED ENTRY ALWAYS SKIPS.
      # `examples/channel-servers/node_modules` is gitignored, so
      # `ShippedReference.test_this_checkout_s_own_channel_server_launches` hits its
      # (loud) skip on every CI run — and the `examples/channel-servers/**` path filter
      # above exists precisely for that case. A check that always skips is worse than
      # one that cannot fail: the skip reads as coverage. `--ignore-scripts` mirrors
      # channel-server-supply-chain.yml (no lifecycle scripts from the dependency tree).
      - name: Install channel-server dependencies (so the shipped-entry case is real)
        run: npm ci --ignore-scripts
        working-directory: examples/channel-servers
      - name: Run bin/ unit tests
        run: python3 -m unittest bin.test_provision_board_tools bin.test_provision_board_tools_samebox bin.test_check_channel_snapshot bin.test_changelog_section -v
