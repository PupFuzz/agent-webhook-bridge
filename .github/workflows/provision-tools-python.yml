name: bin/ python unit tests

# The standalone stdlib-Python operator tools under bin/ carry red-when-reverted
# unit tests. This job runs them in CI so the "CI-tested" guarantee their designs
# rest on is real, not decorative.
#
# THE TOOL SET IS DELIBERATELY NOT ENUMERATED ANYWHERE IN THIS FILE — the
# filesystem is the enumeration. `unittest discover` collects every bin/test_*.py,
# and the path filters glob the directory, so a new tool is wired into CI by
# existing. Until card#5977 the set was written out THREE times (both path filters
# plus a module list in the run step) and each omission failed differently and
# silently: absent from the module list, a tool's tests existed and never ran, and
# the job was green; absent from a path filter, the job could not fire at all —
# the gate went missing rather than red. An empty discovery is loud, so the
# obvious way for the replacement to fail quietly is closed: `python3 -m unittest`
# exits 5 (`NO TESTS RAN`) when it collects nothing, from Python 3.12 onward, and
# the step prints the interpreter version so that premise is auditable per run.
#
# ⚠ THE PATH FILTERS BELOW ARE STILL A COPY, and structurally must be: `paths:` is
# static YAML that GitHub evaluates before any job exists, so nothing this
# workflow runs can check it — a filter that stops covering the tools makes this
# gate ABSENT, which no run reports. That copy is made DETECTABLE instead:
# tests/Feature/Workflows/PythonToolsPathFilterTest.php asserts both filters cover
# every bin/ python file on disk and agree with each other, and it runs under
# laravel-tests.yml, which carries no path filter of its own.
#
# `bin/**`, and the pattern FORM was chosen for verifiability, not for tightness.
# `bin/**.py` would fire on strictly the files the deleted enumeration named — a
# measured symmetric difference of zero — but nothing available here can prove
# GitHub matches it that way, and a glob guessed wrong fails by making this gate
# ABSENT, which is the defect this file was just repaired for. `docs/**` is a
# verbatim row in GitHub's own filter-pattern table with worked examples, so
# `bin/**` is read from the vendor rather than composed by analogy. The price is
# that a PR touching only one of bin/'s `.php` tools now runs this job too —
# measured at 2 commits over v0.70.0..dev, both green in seconds.
#
# ⚠ `app/**` IS IN THE FILTER, AND IT IS LOAD-BEARING — do not "tidy" it out as
# unrelated to bin/. `bin/test_check_channel_snapshot.py` asserts about `app/` PHP
# SOURCE SHAPE: the snapshot probe's no-exec tripwire and the string-only call-site
# tripwire both read `app/` files. While the filter listed only bin/ + the channel
# server, no `app/`-only PR could run this job — so the DL-242 stage-7 migration moved
# the probe's call site out from under its own guard, reddened these tests, and merged
# anyway because the job that would have caught it was structurally unable to fire.
# `dev` then stayed red and unseen (the push: filter had the same gap) until an
# unrelated PR happened to touch examples/channel-servers/**. A check that cannot run
# on the change that invalidates it is a decoration. The cost is this job running on
# app/ PRs — seconds — and that is the correct price for the guarantee.
#
# Node is set up because check-channel-snapshot.py's suite LAUNCHES a real channel
# server: the tool's whole claim is that launching is more precise than enumerating
# files, and a mocked launch would assert the mock. Its cases skip LOUDLY (a banner on
# stderr) rather than silently if node is ever missing.

on:
  pull_request:
    paths:
      - 'bin/**'
      - 'app/**'
      - 'examples/channel-servers/**'
      - '.github/workflows/provision-tools-python.yml'
  push:
    branches: [dev, main]
    paths:
      - 'bin/**'
      - 'app/**'
      - 'examples/channel-servers/**'
      - '.github/workflows/provision-tools-python.yml'

permissions:
  contents: read

jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
      # WITHOUT THIS THE ONLY CASE THAT EXERCISES THE SHIPPED ENTRY ALWAYS SKIPS.
      # `examples/channel-servers/node_modules` is gitignored, so
      # `ShippedReference.test_this_checkout_s_own_channel_server_launches` hits its
      # (loud) skip on every CI run — and the `examples/channel-servers/**` path filter
      # above exists precisely for that case. A check that always skips is worse than
      # one that cannot fail: the skip reads as coverage. `--ignore-scripts` mirrors
      # channel-server-supply-chain.yml (no lifecycle scripts from the dependency tree).
      - name: Install channel-server dependencies (so the shipped-entry case is real)
        run: npm ci --ignore-scripts
        working-directory: examples/channel-servers
      # Discovery IS the enumeration — see the header. `-s bin` doubles as the
      # top-level dir on purpose: the test modules load their subject through
      # `spec_from_file_location` off `__file__` and never import a `bin.` package,
      # so making bin/ importable (an `__init__.py`) would buy nothing. `-VV` pins
      # the interpreter the "empty discovery exits 5" claim above rests on.
      - name: Run bin/ unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -VV
          python3 -m unittest discover -s bin -p 'test_*.py' -v
